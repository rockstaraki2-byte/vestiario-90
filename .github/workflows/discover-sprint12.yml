name: Discover Sprint 12 competitions
on:
  push:
    branches: [feat/sprint12-multisave-calendar-leagues]
    paths:
      - scripts/discover-sprint12-competitions.mjs
      - .github/workflows/discover-sprint12.yml
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sprint12-multisave-calendar-leagues
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/discover-sprint12-competitions.mjs
