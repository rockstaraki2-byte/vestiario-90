name: National Calendar Final Hotfix
on:
  push:
    branches: [main]
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python scripts/national-calendar-final-hotfix.py
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit final calendar hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: harden national team calendar progression"
          git push
      - name: Cleanup hotfix tooling
        run: |
          git rm scripts/national-calendar-final-hotfix.py .github/workflows/national-calendar-final-hotfix.yml
          git commit -m "chore: remove national calendar hotfix tooling"
          git push
