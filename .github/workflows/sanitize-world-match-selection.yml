name: Sanitize world match selection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sanitize-world-match-selection.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch selection normalization and UI message
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/game-engine/season.ts')
          t=p.read_text()
          anchor='export function worldMatchEligibilityReasons(state:SeasonState,matchId:string){const item=worldCompetitionMatchById(state.worldCompetitions,matchId);if(!item)return{};const map=competitionAvailabilityMap(state.competitionGovernance,item.tournament.definition.id,getSelectedClub(state));return Object.fromEntries(Object.entries(map).filter(([,value])=>!value.eligible).map(([id,value])=>[id,value.reason??"Indisponível nesta competição"]));}'
          addition=anchor+'\nexport function sanitizeMatchdaySelectionForMatch(state:SeasonState,matchId:string):SeasonState{const item=worldCompetitionMatchById(state.worldCompetitions,matchId);if(!item)return state;const club=getSelectedClub(state),eligible=new Set(eligiblePlayerIds(state.competitionGovernance,item.tournament.definition.id,club)),availableIds=new Set(club.players.filter(player=>player.injuryDays===0&&eligible.has(player.id)).map(player=>player.id)),lineup=(state.lineupIds??[]).filter((id,index,list)=>list.indexOf(id)===index&&availableIds.has(id)).slice(0,11),starters=new Set(lineup),limit=worldCompetitionRule(item.tournament.definition.id).benchSize,bench=(state.benchIds??[]).filter((id,index,list)=>list.indexOf(id)===index&&availableIds.has(id)&&!starters.has(id)).slice(0,limit);if(lineup.length===state.lineupIds.length&&bench.length===state.benchIds.length)return state;const league=cloneLeague(state.league),nextClub=league.clubs.find(current=>current.id===state.selectedClubId)!;nextClub.players.forEach(player=>refreshStatus(player,lineup.includes(player.id),bench.includes(player.id)));return{...state,league,lineupIds:lineup,benchIds:bench};}'
          if anchor not in t: raise SystemExit('season anchor not found')
          t=t.replace(anchor,addition,1)
          old='const prepareClubMatch=(current:SeasonState,context:MediaMatchContext,cupMatchId?:string)=>{let next=prepareMedia(current,context);next=applyConfiguredMatchdaySelection(next,cupMatchId);next=applyConfiguredMediaDelegation(next);return next;};'
          new='const prepareClubMatch=(current:SeasonState,context:MediaMatchContext,cupMatchId?:string)=>{let next=prepareMedia(current,context);if(cupMatchId)next=sanitizeMatchdaySelectionForMatch(next,cupMatchId);next=applyConfiguredMatchdaySelection(next,cupMatchId);next=applyConfiguredMediaDelegation(next);return next;};'
          if old not in t: raise SystemExit('prepareClubMatch anchor not found')
          p.write_text(t.replace(old,new,1))

          p=Path('src/app/tactics-setup-view.tsx')
          t=p.read_text()
          old='{selectionReady?"IR PARA A PARTIDA":lineupIds.length!==11?`SELECIONE 11 TITULARES`:`COMPLETE O BANCO (${validBenchIds.length}/${requiredBench})`}'
          new='{selectionReady?"IR PARA A PARTIDA":validLineupIds.length!==11?`AJUSTE O XI VÁLIDO (${validLineupIds.length}/11)`:`COMPLETE O BANCO (${validBenchIds.length}/${requiredBench})`}'
          if old not in t: raise SystemExit('button message anchor not found')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/sanitize-world-match-selection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(matchday): purge ineligible players from cup selection"
          git push origin main
