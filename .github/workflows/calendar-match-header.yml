name: Calendar match header upgrade
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply calendar and competition header patch
        run: python .github/scripts/calendar-match-header-patch.py
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/calendar-match-header.yml
          rm .github/scripts/calendar-match-header-patch.py
          git add -A
          git commit -m "feat: surface matchday and competition headers"
          git push
