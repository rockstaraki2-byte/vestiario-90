name: PWA back navigation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    if: github.event.head_commit.message == 'chore: apply PWA back navigation upgrade'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Implement internal back navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/page.tsx')
          s=p.read_text()
          s=s.replace('import { useEffect, useState } from "react";','import { useEffect, useRef, useState } from "react";')
          old='  useEffect(()=>{migrateLegacySeason()},[]);\n'
          new='''  const navigationReady=useRef(false),lastNavigationKey=useRef("");\n  useEffect(()=>{migrateLegacySeason()},[]);\n  useEffect(()=>{\n    const key=`${screen}:${active}`;\n    if(!navigationReady.current){\n      navigationReady.current=true;lastNavigationKey.current=key;\n      window.history.replaceState({...window.history.state,v90:true,screen,active},"");\n      return;\n    }\n    if(lastNavigationKey.current===key)return;\n    lastNavigationKey.current=key;\n    window.history.pushState({v90:true,screen,active},"");\n  },[screen,active]);\n  useEffect(()=>{\n    const onPopState=(event:PopStateEvent)=>{\n      const state=event.state as {v90?:boolean;screen?:"menu"|"game";active?:string}|null;\n      if(!state?.v90||!state.screen)return;\n      const nextActive=state.active??"Visão geral";\n      lastNavigationKey.current=`${state.screen}:${nextActive}`;\n      setMoreOpen(false);setMatch(null);\n      if(!liveMatch)setActiveCupMatchId(null);\n      setScreen(state.screen);setActive(nextActive);\n    };\n    window.addEventListener("popstate",onPopState);\n    return()=>window.removeEventListener("popstate",onPopState);\n  },[liveMatch]);\n'''
          if old not in s: raise SystemExit('navigation anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit validated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/pwa-back-navigation.yml
          git add -A
          git commit -m "fix: make Android back navigate inside the PWA"
          git push
