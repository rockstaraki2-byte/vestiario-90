name: Sprint 7 international competition fields
on:
  push:
    branches:
      - sprint7-international-cups
    paths:
      - "src/data/world-2026/international-cup-fields.ts"
      - "src/data/world-2026/international-cup-fields.test.ts"
      - "src/game-engine/international-cup-engine.test.ts"
      - "scripts/apply-sprint7-international-cups.mjs"
      - ".github/workflows/sprint7-international-cups.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v90-sprint7-international-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint7-international-cups
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Sprint 7 engine and sync hardening
        run: node scripts/apply-sprint7-international-cups.mjs
      - name: Validate continental fields and engine
        run: npx vitest run src/data/world-2026/international-cup-fields.test.ts src/game-engine/international-cup-engine.test.ts src/data/database-status.test.ts src/game-engine/world-competitions.test.ts
      - name: Validate production build
        run: npm run build
      - name: Persist validated Sprint 7 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-engine/world-competitions.ts scripts/fetch-international-participants-2026.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(sprint7): integrate real continental participants"
          git push origin HEAD:sprint7-international-cups
