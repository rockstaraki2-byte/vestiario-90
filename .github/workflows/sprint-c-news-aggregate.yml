name: Sprint C News Aggregate
on:
  push:
    paths:
      - '.github/workflows/sprint-c-news-aggregate.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/apply-sprint-c-news-aggregate.py
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-engine src/app
          git commit -m "feat: add training sprint C multi-league news and aggregate scores"
          git rm scripts/apply-sprint-c-news-aggregate.py .github/workflows/sprint-c-news-aggregate.yml
          git commit -m "chore: remove sprint C rollout tooling"
          git push origin main
