name: Fix Career Season End
on:
  push:
    branches: [feat/sprint10-manager-career]
    paths:
      - .github/workflows/fix-career-season-end.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sprint10-manager-career
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch unemployed season rollover
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/page.tsx')
          s=p.read_text()
          old='function handleCareerAdvanceRound(){if(season.completed){flash("A temporada terminou. Inicie a próxima para continuar procurando trabalho.");return}const next=playCurrentRound(season);persist(next);flash(`Rodada ${Math.min(38,next.currentRound-1)} simulada • mercado de treinadores atualizado`)}'
          new='function handleCareerAdvanceRound(){if(season.completed){handleNextSeason();return}const next=playCurrentRound(season);persist(next);flash(`Rodada ${Math.min(38,next.currentRound-1)} simulada • mercado de treinadores atualizado`)}'
          if old not in s: raise SystemExit('marker not found')
          p.write_text(s.replace(old,new))
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "fix: continue unemployed career across seasons"
          git push origin HEAD:feat/sprint10-manager-career
