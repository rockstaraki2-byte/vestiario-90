name: Apply tactics UX patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-tactics-ux-patch.mjs'
      - '.github/workflows/apply-tactics-ux-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/apply-tactics-ux-patch.mjs
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit patch and remove temporary migration files
        run: |
          rm -f scripts/apply-tactics-ux-patch.mjs .github/workflows/apply-tactics-ux-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: improve tactics presets and matchday UX"
          git push
