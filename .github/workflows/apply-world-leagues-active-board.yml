name: Apply world leagues and active board upgrade
on:
  push:
    paths:
      - '.github/workflows/apply-world-leagues-active-board.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add parallel league simulation
        run: |
          cat > src/game-engine/world-leagues.ts <<'EOF'
          import { SeededRng } from "./rng";
          import { generateFixtures, type LeagueFixture, type LeagueStanding } from "./league";
          import { PROFESSIONAL_COMPETITIONS, professionalCompetitionById, type ProfessionalCompetitionId } from "../data/brazil-2026/competitions";

          export type WorldLeagueTeam={id:string;name:string;shortName:string;imageUrl:string;strength:number};
          export type WorldLeaguePlayer={id:string;clubId:string;name:string;position:string;marketValueEur:number|null;appearances:number;goals:number;assists:number;ratingTotal:number;ratedMatches:number;averageRating:number};
          export type ParallelLeagueState={competitionId:ProfessionalCompetitionId;name:string;shortName:string;country:string;season:number;teams:WorldLeagueTeam[];fixtures:LeagueFixture[];standings:LeagueStanding[];players:WorldLeaguePlayer[]};
          export type WorldLeaguesState={season:number;leagues:Partial<Record<ProfessionalCompetitionId,ParallelLeagueState>>;lastProcessedDate?:string};

          const teamStrength=(market:number)=>Math.max(52,Math.min(94,56+Math.log10(Math.max(1_000_000,market)/1_000_000)*11));
          const positionWeight=(position:string)=>position==="ATA"?6:["PE","PD"].includes(position)?5:position==="MEI"?4:["MC","VOL"].includes(position)?3:["LD","LE"].includes(position)?2.2:position==="ZAG"?1.2:.35;
          function weightedPick<T>(rng:SeededRng,items:T[],weight:(item:T)=>number){let total=items.reduce((sum,item)=>sum+Math.max(.05,weight(item)),0),roll=rng.next()*total;for(const item of items){roll-=Math.max(.05,weight(item));if(roll<=0)return item;}return items[items.length-1];}
          function goals(rng:SeededRng,lambda:number){let value=0;const attempts=6,p=Math.max(.04,Math.min(.58,lambda/attempts));for(let i=0;i<attempts;i++)if(rng.next()<p)value++;return value;}
          function standingFor(league:ParallelLeagueState,id:string){return league.standings.find(item=>item.clubId===id)!;}
          function updateTable(league:ParallelLeagueState,fixture:LeagueFixture,hg:number,ag:number){const h=standingFor(league,fixture.homeClubId),a=standingFor(league,fixture.awayClubId);h.played++;a.played++;h.goalsFor+=hg;h.goalsAgainst+=ag;a.goalsFor+=ag;a.goalsAgainst+=hg;if(hg>ag){h.won++;a.lost++;h.points+=3}else if(ag>hg){a.won++;h.lost++;a.points+=3}else{h.drawn++;a.drawn++;h.points++;a.points++;}}
          function ratePlayers(players:WorldLeaguePlayer[],won:boolean,draw:boolean,goalIds:string[],assistIds:string[],rng:SeededRng){for(const player of players){player.appearances++;let rating=6.25+(won?.35:draw?.08:-.18)+rng.integer(-18,18)/100+goalIds.filter(id=>id===player.id).length*.75+assistIds.filter(id=>id===player.id).length*.45;rating=Math.max(4.8,Math.min(9.8,rating));player.ratingTotal+=rating;player.ratedMatches++;player.averageRating=Math.round(player.ratingTotal/player.ratedMatches*100)/100;}}
          function simulateFixture(league:ParallelLeagueState,fixture:LeagueFixture,seed:string){const home=league.teams.find(t=>t.id===fixture.homeClubId)!,away=league.teams.find(t=>t.id===fixture.awayClubId)!,rng=new SeededRng(`${seed}:${league.competitionId}:${fixture.id}`),delta=(home.strength-away.strength)/13,hg=goals(rng,1.48+delta*.32),ag=goals(rng,1.18-delta*.27),homePool=league.players.filter(p=>p.clubId===home.id).sort((a,b)=>(b.marketValueEur??0)-(a.marketValueEur??0)).slice(0,11),awayPool=league.players.filter(p=>p.clubId===away.id).sort((a,b)=>(b.marketValueEur??0)-(a.marketValueEur??0)).slice(0,11),homeGoals:string[]=[],awayGoals:string[]=[],homeAssists:string[]=[],awayAssists:string[]=[];
            for(let i=0;i<hg;i++){const scorer=weightedPick(rng,homePool,p=>positionWeight(p.position)*(1+Math.log10(Math.max(100_000,p.marketValueEur??100_000)/100_000)*.08));scorer.goals++;homeGoals.push(scorer.id);const others=homePool.filter(p=>p.id!==scorer.id);if(others.length&&rng.next()<.74){const assist=weightedPick(rng,others,p=>positionWeight(p.position));assist.assists++;homeAssists.push(assist.id);}}
            for(let i=0;i<ag;i++){const scorer=weightedPick(rng,awayPool,p=>positionWeight(p.position)*(1+Math.log10(Math.max(100_000,p.marketValueEur??100_000)/100_000)*.08));scorer.goals++;awayGoals.push(scorer.id);const others=awayPool.filter(p=>p.id!==scorer.id);if(others.length&&rng.next()<.74){const assist=weightedPick(rng,others,p=>positionWeight(p.position));assist.assists++;awayAssists.push(assist.id);}}
            ratePlayers(homePool,hg>ag,hg===ag,homeGoals,homeAssists,rng);ratePlayers(awayPool,ag>hg,hg===ag,awayGoals,awayAssists,rng);updateTable(league,fixture,hg,ag);fixture.played=true;fixture.homeGoals=hg;fixture.awayGoals=ag;fixture.homeShots=Math.max(hg+3,rng.integer(7,17));fixture.awayShots=Math.max(ag+3,rng.integer(6,15));fixture.possessionHome=Math.max(35,Math.min(65,Math.round(50+delta*3+rng.integer(-6,6))));}
          function createParallelLeague(baseSeed:string,year:number,id:ProfessionalCompetitionId):ParallelLeagueState{const def=professionalCompetitionById(id),teams=def.clubs.map((club,index)=>({id:`${id}-club-${index+1}`,name:club.name,shortName:club.shortName,imageUrl:club.imageUrl,strength:teamStrength(club.marketValueEur)})),players:WorldLeaguePlayer[]=[];def.clubs.forEach((club,index)=>club.players.forEach((player,pIndex)=>players.push({id:`${id}-club-${index+1}-p${pIndex+1}`,clubId:`${id}-club-${index+1}`,name:player.name,position:player.position,marketValueEur:player.marketValueEur,appearances:0,goals:0,assists:0,ratingTotal:0,ratedMatches:0,averageRating:0})));const fixtures=generateFixtures(teams.map(t=>t.id),`${year}${def.startDate.slice(4)}`,def.roundCadenceDays,def.doubleRoundRobin);return{competitionId:id,name:def.name,shortName:def.shortName,country:def.country,season:year,teams,fixtures,standings:teams.map(t=>({clubId:t.id,played:0,won:0,drawn:0,lost:0,goalsFor:0,goalsAgainst:0,points:0})),players};}
          export function createWorldLeagues(baseSeed:string,year:number,currentCompetitionId:ProfessionalCompetitionId):WorldLeaguesState{const leagues:Partial<Record<ProfessionalCompetitionId,ParallelLeagueState>>={};for(const comp of PROFESSIONAL_COMPETITIONS)if(comp.id!==currentCompetitionId)leagues[comp.id]=createParallelLeague(baseSeed,year,comp.id);return{season:year,leagues};}
          export function processWorldLeaguesThroughDate(value:WorldLeaguesState,baseSeed:string,date:string){const state:WorldLeaguesState=structuredClone(value);for(const league of Object.values(state.leagues)){if(!league)continue;for(const fixture of league.fixtures)if(!fixture.played&&fixture.date&&fixture.date<=date)simulateFixture(league,fixture,`${baseSeed}:${state.season}:parallel`);}state.lastProcessedDate=date;return state;}
          export function hydrateWorldLeagues(value:WorldLeaguesState|undefined,baseSeed:string,year:number,currentCompetitionId:ProfessionalCompetitionId,currentDate:string){let state=value?.season===year?structuredClone(value):createWorldLeagues(baseSeed,year,currentCompetitionId);for(const comp of PROFESSIONAL_COMPETITIONS){if(comp.id===currentCompetitionId){delete state.leagues[comp.id];continue}if(!state.leagues[comp.id])state.leagues[comp.id]=createParallelLeague(baseSeed,year,comp.id);}return processWorldLeaguesThroughDate(state,baseSeed,currentDate);}
          export function parallelLeagueById(state:WorldLeaguesState,id:ProfessionalCompetitionId){return state.leagues[id];}
          export function sortedParallelStandings(standings:LeagueStanding[]){return[...standings].sort((a,b)=>b.points-a.points||(b.goalsFor-b.goalsAgainst)-(a.goalsFor-a.goalsAgainst)||b.goalsFor-a.goalsFor);}
          export function parallelTopPlayers(league:ParallelLeagueState,key:"goals"|"assists"|"averageRating",limit=10){return[...league.players].filter(p=>key!=="averageRating"||p.ratedMatches>=2).sort((a,b)=>b[key]-a[key]||b.goals-a.goals).slice(0,limit);}
          EOF
      - name: Add active board engine
        run: |
          cat > src/game-engine/active-board.ts <<'EOF'
          import type { LeagueClub, LeagueWorld } from "./league";
          import { sortedStandings } from "./league";
          import type { SeasonState } from "./season";
          import type { LivingWorldState, WorldInboxEvent, WorldNews } from "./world-events";

          export type BoardObjectiveStatus="No caminho"|"Atenção"|"Cumprida"|"Falhou";
          export type BoardObjective={id:string;category:"Liga"|"Copas"|"Elenco"|"Finanças"|"Base";title:string;description:string;priority:"Essencial"|"Alta"|"Média";progress:number;status:BoardObjectiveStatus};
          export type BoardEvaluation={id:string;round:number;date:string;score:number;verdict:"Excelente"|"Positiva"|"Estável"|"Sob pressão"|"Crítica";summary:string;position:number;targetPosition:number;form:string;boardConfidence:number};
          export type BoardMeeting={id:string;eventId:string;round:number;date:string;title:string;agenda:string[];status:"Pendente"|"Realizada"};
          export type BoardStatement={id:string;round:number;date:string;tone:"positive"|"neutral"|"negative";headline:string;body:string};
          export type ActiveBoardState={season:number;clubId:string;philosophy:string;targetPosition:number;objectives:BoardObjective[];evaluations:BoardEvaluation[];meetings:BoardMeeting[];statements:BoardStatement[];lastEvaluationRound?:number};

          const clamp=(v:number)=>Math.max(0,Math.min(100,Math.round(v)));
          function expectedPosition(club:LeagueClub,league:LeagueWorld){const rank=[...league.clubs].sort((a,b)=>b.reputation-a.reputation).findIndex(c=>c.id===club.id)+1,n=league.clubs.length;if(rank<=3)return Math.min(4,n);if(rank<=6)return Math.min(6,n);if(rank<=Math.ceil(n*.55))return Math.min(10,n);return Math.min(15,n);}
          function objectives(target:number):BoardObjective[]{return[
            {id:"league",category:"Liga",title:`Terminar entre os ${target} primeiros`,description:"A posição na liga é a principal régua esportiva da temporada.",priority:"Essencial",progress:0,status:"No caminho"},
            {id:"cups",category:"Copas",title:"Ser competitivo nas copas",description:"A diretoria espera desempenho condizente com a força do elenco em mata-matas.",priority:"Alta",progress:50,status:"No caminho"},
            {id:"squad",category:"Elenco",title:"Manter o vestiário competitivo",description:"Moral, confiança e gestão de minutos precisam permanecer sob controle.",priority:"Alta",progress:70,status:"No caminho"},
            {id:"finance",category:"Finanças",title:"Respeitar a estrutura salarial",description:"O gasto mensal do elenco deve permanecer dentro do teto aprovado.",priority:"Alta",progress:80,status:"No caminho"},
            {id:"youth",category:"Base",title:"Desenvolver ativos jovens",description:"A diretoria valoriza minutos e evolução para atletas de até 21 anos.",priority:"Média",progress:40,status:"No caminho"},
          ];}
          export function createActiveBoard(club:LeagueClub,league:LeagueWorld,year:number):ActiveBoardState{const target=expectedPosition(club,league);return{season:year,clubId:club.id,philosophy:target<=6?"Competir por títulos sem perder sustentabilidade e patrimônio esportivo.":"Construir uma equipe competitiva, sustentável e com evolução de ativos.",targetPosition:target,objectives:objectives(target),evaluations:[],meetings:[],statements:[]};}
          export function hydrateActiveBoard(value:ActiveBoardState|undefined,state:SeasonState){const club=state.league.clubs.find(c=>c.id===state.selectedClubId)??state.league.clubs[0];if(!value||value.season!==state.year||value.clubId!==club.id)return createActiveBoard(club,state.league,state.year);return{...value,objectives:(value.objectives?.length?value.objectives:objectives(value.targetPosition)).map(o=>({...o})),evaluations:[...(value.evaluations??[])],meetings:[...(value.meetings??[])],statements:[...(value.statements??[])]};}
          function addEvent(world:LivingWorldState,event:Omit<WorldInboxEvent,"createdOrder">){const order=world.sequence+1;return{...world,sequence:order,inbox:[{...event,createdOrder:order},...world.inbox].slice(0,80)};}
          function addNews(world:LivingWorldState,news:Omit<WorldNews,"createdOrder">){const order=world.sequence+1;return{...world,sequence:order,news:[{...news,createdOrder:order},...world.news].slice(0,110)};}
          function updateObjectives(board:ActiveBoardState,state:SeasonState,position:number){const club=state.league.clubs.find(c=>c.id===state.selectedClubId)!,morale=Math.round(club.players.reduce((s,p)=>s+p.morale,0)/Math.max(1,club.players.length)),wage=club.players.reduce((s,p)=>s+p.contract.salaryBrlMonthly,0),youthMinutes=club.players.filter(p=>p.age<=21).reduce((s,p)=>s+p.minutes,0),allMinutes=club.players.reduce((s,p)=>s+p.minutes,0),youthShare=allMinutes?youthMinutes/allMinutes:0;return board.objectives.map(o=>{let progress=o.progress;if(o.id==="league")progress=clamp(100-(position-board.targetPosition)*11);if(o.id==="squad")progress=morale;if(o.id==="finance")progress=clamp(100-Math.max(0,(wage/Math.max(1,club.wageBudgetBrlMonthly)-1)*160));if(o.id==="youth")progress=clamp(youthShare*650);const status:BoardObjectiveStatus=progress>=92?"Cumprida":progress>=58?"No caminho":progress>=35?"Atenção":"Falhou";return{...o,progress,status};});}
          export function processActiveBoardAfterRound(state:SeasonState):SeasonState{if(state.career?.status!=="Empregado")return state;const completedRound=Math.max(0,state.currentRound-1),board=hydrateActiveBoard(state.boardState,state),threeLosses=state.recentForm.slice(-3).join("")==="DDD";if(completedRound<=0||board.lastEvaluationRound===completedRound||(completedRound%4!==0&&!threeLosses))return{...state,boardState:board};const club=state.league.clubs.find(c=>c.id===state.selectedClubId)!,table=sortedStandings(state.league),position=table.findIndex(s=>s.clubId===club.id)+1,leagueScore=clamp(78-(position-board.targetPosition)*9),formScore=clamp(55+state.recentForm.reduce((s,r)=>s+(r==="V"?9:r==="D"?-8:1),0)),morale=Math.round(club.players.reduce((s,p)=>s+p.morale,0)/Math.max(1,club.players.length)),wage=club.players.reduce((s,p)=>s+p.contract.salaryBrlMonthly,0),financeScore=wage<=club.wageBudgetBrlMonthly?82:clamp(78-(wage/club.wageBudgetBrlMonthly-1)*180),score=clamp(leagueScore*.42+formScore*.25+morale*.18+financeScore*.15),verdict:BoardEvaluation["verdict"]=score>=82?"Excelente":score>=68?"Positiva":score>=54?"Estável":score>=38?"Sob pressão":"Crítica",form=state.recentForm.join(" ")||"—",summary=score>=68?`A diretoria entende que o trabalho está alinhado ao planejamento. O ${club.name} ocupa a ${position}ª posição e mantém margem para evoluir.`:score>=54?`O trabalho segue dentro de uma faixa aceitável, mas a diretoria quer evolução concreta nas próximas rodadas.`:`A diretoria considera o momento abaixo do planejamento. Posição, forma recente e ambiente passam a ser monitorados de perto.`,evaluation:BoardEvaluation={id:`board-eval-${state.year}-${completedRound}`,round:completedRound,date:state.currentDate,score,verdict,summary,position,targetPosition:board.targetPosition,form,boardConfidence:state.livingWorld.boardConfidence},eventId=`active-board-meeting-${state.year}-${completedRound}`,meeting:BoardMeeting={id:`meeting-${state.year}-${completedRound}`,eventId,round:completedRound,date:state.currentDate,title:`Reunião de avaliação — rodada ${completedRound}`,agenda:[`Posição atual: ${position}º • meta: top ${board.targetPosition}`,`Forma recente: ${form}`,`Confiança da diretoria: ${state.livingWorld.boardConfidence}%`,`Avaliação do ciclo: ${score}/100 (${verdict})`],status:"Pendente"},tone:BoardStatement["tone"]=score>=68?"positive":score<50?"negative":"neutral",statement:BoardStatement={id:`statement-${state.year}-${completedRound}`,round:completedRound,date:state.currentDate,tone,headline:score>=68?`Diretoria do ${club.name} respalda planejamento`:score<50?`Diretoria cobra reação do ${club.name}`:`Diretoria mantém avaliação aberta sobre o momento`,body:score>=68?`Em manifestação institucional, a diretoria destacou evolução e alinhamento, mas reforçou que as metas da temporada permanecem ativas.`:score<50?`A diretoria declarou publicamente que os resultados recentes estão abaixo do esperado e espera resposta esportiva nas próximas partidas.`:`A diretoria afirmou que o trabalho segue sendo avaliado rodada a rodada, com foco nas metas estabelecidas no início da temporada.`};let world={...state.livingWorld,boardConfidence:clamp(state.livingWorld.boardConfidence+(score>=75?3:score<45?-5:score<55?-2:1))};world=addEvent(world,{id:eventId,kind:"Diretoria",title:meeting.title,body:`${summary} Pauta: ${meeting.agenda.join(" • ")}.`,round:completedRound,unread:true,resolved:false,choices:[{id:"align",label:"Reforçar alinhamento com o plano",outcome:"A diretoria valorizou a leitura objetiva e o compromisso com as metas.",effect:{boardConfidence:3,managerReputation:1}},{id:"ambition",label:"Cobrar mais ambição do clube",outcome:"A fala aumentou a expectativa interna e externa sobre os próximos resultados.",effect:{boardConfidence:1,mediaPressure:3,managerReputation:2}},{id:"time",label:"Pedir tempo para consolidar o trabalho",outcome:"A diretoria aceitou a justificativa, mas espera sinais claros de evolução.",effect:{boardConfidence:-1,mediaPressure:-1}}]});world=addNews(world,{id:statement.id,headline:statement.headline,summary:statement.body,source:`Diretoria do ${club.name} • comunicado simulado`,round:completedRound,tone});const nextBoard:ActiveBoardState={...board,lastEvaluationRound:completedRound,objectives:updateObjectives(board,state,position),evaluations:[evaluation,...board.evaluations].slice(0,20),meetings:[meeting,...board.meetings].slice(0,20),statements:[statement,...board.statements].slice(0,30)};return{...state,livingWorld:world,boardState:nextBoard};}
          EOF
      - name: Wire engines into season
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/game-engine/season.ts');s=p.read_text()
          anchor='import { DEFAULT_TRAINING_PLAN, applyTrainingDay, type TrainingPlan } from "./training";\n'
          additions='import { createWorldLeagues, hydrateWorldLeagues, processWorldLeaguesThroughDate, type WorldLeaguesState } from "./world-leagues";\nimport { createActiveBoard, hydrateActiveBoard, processActiveBoardAfterRound, type ActiveBoardState } from "./active-board";\n'
          if additions not in s:s=s.replace(anchor,anchor+additions)
          s=s.replace('  trainingPlan:TrainingPlan;\n  championClubId?:string;', '  trainingPlan:TrainingPlan;\n  worldLeagues:WorldLeaguesState;\n  boardState:ActiveBoardState;\n  championClubId?:string;')
          old='competitionId,currentDate:addIsoDays(firstDate,-7),trainingPlan:DEFAULT_TRAINING_PLAN};'
          new='competitionId,currentDate:addIsoDays(firstDate,-7),trainingPlan:DEFAULT_TRAINING_PLAN,worldLeagues:createWorldLeagues(baseSeed,year,competitionId),boardState:createActiveBoard(club,league,year)};'
          if old not in s: raise SystemExit('createSeason anchor missing')
          s=s.replace(old,new,1)
          old='const nextState:SeasonState={...state,league,currentRound:nextRound,lineupIds:selection.lineupIds,benchIds:selection.benchIds,recentForm,completed,championClubId,lastUserMatch,livingWorld,mediaWorld,career:careerResult.career,clubAi,worldCompetitions,internationalMarket,advancedWorld};return processInternationalMarketRound(processMarketRound(processClubManagementRound(nextState)));'
          new='const nextState:SeasonState={...state,league,currentRound:nextRound,lineupIds:selection.lineupIds,benchIds:selection.benchIds,recentForm,completed,championClubId,lastUserMatch,livingWorld,mediaWorld,career:careerResult.career,clubAi,worldCompetitions,internationalMarket,advancedWorld,worldLeagues:processWorldLeaguesThroughDate(state.worldLeagues,state.baseSeed,state.currentDate)};const processed=processInternationalMarketRound(processMarketRound(processClubManagementRound(nextState)));return processActiveBoardAfterRound(processed);'
          if old not in s: raise SystemExit('playCurrentRound anchor missing')
          s=s.replace(old,new,1)
          old='const selection=normalizeMatchdaySelection({...state,league} as SeasonState,club);let livingWorld=state.livingWorld??createLivingWorld(club.name,state.competitionId),mediaWorld=hydrateMediaWorld(state.mediaWorld,state.competitionId);if(state.career?.status!=="Sem clube"){livingWorld=worldAfterDay(livingWorld,club,state.currentRound,state.baseSeed,state.competitionId);}const advancedWorld=processAdvancedDay(state.advancedWorld,league,state.selectedClubId,state.currentDate,calendarDay,state.baseSeed,state.year);return processMarketRound({...state,league,lineupIds:selection.lineupIds,benchIds:selection.benchIds,livingWorld,mediaWorld,advancedWorld});'
          new='const selection=normalizeMatchdaySelection({...state,league} as SeasonState,club);let livingWorld=state.livingWorld??createLivingWorld(club.name,state.competitionId),mediaWorld=hydrateMediaWorld(state.mediaWorld,state.competitionId);if(state.career?.status!=="Sem clube"){livingWorld=worldAfterDay(livingWorld,club,state.currentRound,state.baseSeed,state.competitionId);}const advancedWorld=processAdvancedDay(state.advancedWorld,league,state.selectedClubId,state.currentDate,calendarDay,state.baseSeed,state.year),worldLeagues=processWorldLeaguesThroughDate(state.worldLeagues,state.baseSeed,state.currentDate);return processMarketRound({...state,league,lineupIds:selection.lineupIds,benchIds:selection.benchIds,livingWorld,mediaWorld,advancedWorld,worldLeagues});'
          if old not in s: raise SystemExit('advance day anchor missing')
          s=s.replace(old,new,1)
          old='parsed.nationalCareer=hydrateNationalCareer(parsed.nationalCareer,parsed.league,parsed.baseSeed,year,parsed.livingWorld.managerReputation,parsed.currentRound);const club=getSelectedClub(parsed),selection=normalizeMatchdaySelection(parsed,club);parsed.lineupIds=selection.lineupIds;parsed.benchIds=selection.benchIds;return parsed;'
          new='parsed.nationalCareer=hydrateNationalCareer(parsed.nationalCareer,parsed.league,parsed.baseSeed,year,parsed.livingWorld.managerReputation,parsed.currentRound);parsed.worldLeagues=hydrateWorldLeagues(parsed.worldLeagues,parsed.baseSeed,year,competitionId,parsed.currentDate);const club=getSelectedClub(parsed),selection=normalizeMatchdaySelection(parsed,club);parsed.lineupIds=selection.lineupIds;parsed.benchIds=selection.benchIds;parsed.boardState=hydrateActiveBoard(parsed.boardState,parsed);return parsed;'
          if old not in s: raise SystemExit('hydrate anchor missing')
          s=s.replace(old,new,1)
          old='next={...next,selectedClubId:newClub.id,lineupIds,benchIds,recentForm:[],lastUserMatch:undefined};'
          new='next={...next,selectedClubId:newClub.id,lineupIds,benchIds,recentForm:[],lastUserMatch:undefined,boardState:createActiveBoard(newClub,league,state.year)};'
          if old in s:s=s.replace(old,new,1)
          # next season initialization
          old='competitionId,currentDate:addIsoDays(firstDate,-7)};'
          new='competitionId,currentDate:addIsoDays(firstDate,-7),worldLeagues:createWorldLeagues(state.baseSeed,nextYear,competitionId),boardState:createActiveBoard(club,prepared.league,nextYear)};'
          if old not in s: raise SystemExit('next season anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Remove legacy generic board meeting
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/game-engine/world-events.ts');s=p.read_text()
          pattern=r'\n if\(round%5===0\)\{.*?\n \}\n const network='
          s2,n=re.subn(pattern,'\n const network=',s,count=1,flags=re.S)
          if n!=1: print('legacy board block already absent or changed')
          p.write_text(s2)
          PY
      - name: Upgrade football world browser
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/football-world-view.tsx');s=p.read_text()
          s=s.replace('import { BadgeCheck, CalendarRange, ChevronRight, Flag, Globe2, Shield, Trophy, UserRoundCog } from "lucide-react";', 'import { BadgeCheck, BarChart3, CalendarDays, CalendarRange, ChevronRight, Flag, Globe2, ListOrdered, Shield, Trophy, UserRoundCog } from "lucide-react";')
