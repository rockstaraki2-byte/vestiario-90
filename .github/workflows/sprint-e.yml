name: Sprint E Staff Analytics
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-sprint-e.py'
      - '.github/workflows/sprint-e.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python scripts/apply-sprint-e.py
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat: sprint E staff and match analytics" || true
          git push
      - name: Remove rollout tooling
        run: |
          git rm scripts/apply-sprint-e.py .github/workflows/sprint-e.yml
          git commit -m "chore: remove sprint E rollout tooling"
          git push
