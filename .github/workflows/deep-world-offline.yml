          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public next.config.ts
          git rm .github/workflows/deep-world-offline.yml
          git commit -m "feat: deepen persistent world and add offline PWA"
