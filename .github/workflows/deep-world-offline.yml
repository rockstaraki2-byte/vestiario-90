          repl='<p className={styles.intro}>{activeBoard.philosophy}</p>{activeBoard.mandate&&<div className={styles.evaluationStrip}><span>Mandato <b>{activeBoard.mandate.name}</b></span><span>Pressão <b>{activeBoard.mandate.pressure}</b></span><span>Paciência <b>{activeBoard.mandate.patience}/100</b></span><span>Meta <b>Top {activeBoard.targetPosition}</b></span></div>}<div className={styles.objectives}>'
          if anchor not in s: raise SystemExit('club board UI anchor missing')
          s=s.replace(anchor,repl,1);p.write_text(s)
          PY

      - name: Validate upgrade
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit validated upgrade
