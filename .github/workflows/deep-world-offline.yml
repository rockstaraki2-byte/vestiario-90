name: Deep world and offline PWA
on:
  push:
    paths:
      - '.github/workflows/deep-world-offline.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add persistent club dynamics and PWA shell
        run: |
          cat > src/game-engine/club-dynamics.ts <<'EOF'
          import type { LeagueWorld } from "./league";
          import type { WorldCompetitionsState } from "./world-competitions";
          import type { AdvancedWorldState } from "./advanced-world";
          import type { ClubAiState } from "./club-ai";
          import type { ProfessionalCompetitionId } from "../data/brazil-2026/competitions";

          export type ClubTrendPoint={
            year:number;clubName:string;competitionId:ProfessionalCompetitionId;position:number;
            reputationBefore:number;reputationAfter:number;reputationDelta:number;
            marketValueBefore:number;marketValueAfter:number;
            transferBudgetBefore:number;transferBudgetAfter:number;
            wageBudgetBefore:number;wageBudgetAfter:number;
            estimatedRevenueEur:number;estimatedExpensesEur:number;operatingResultEur:number;
            managerName?:string;managerStyle?:string;summary:string;
          };
          export type ClubDynamicsState={history:Record<string,ClubTrendPoint[]>;lastEvolvedYear?:number};

          const clamp=(value:number,min:number,max:number)=>Math.max(min,Math.min(max,value));
          const round100k=(value:number)=>Math.round(value/100_000)*100_000;
          const key=(value:string)=>value.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
          export function createClubDynamics():ClubDynamicsState{return{history:{}};}
          export function hydrateClubDynamics(value:ClubDynamicsState|undefined):ClubDynamicsState{return value?{history:value.history??{},lastEvolvedYear:value.lastEvolvedYear}:createClubDynamics();}
          export function clubTrendHistory(value:ClubDynamicsState|undefined,clubName:string){return[...(hydrateClubDynamics(value).history[key(clubName)]??[])].sort((a,b)=>b.year-a.year);}
          export function latestClubTrend(value:ClubDynamicsState|undefined,clubName:string){return clubTrendHistory(value,clubName)[0];}

          function competitionBase(id:ProfessionalCompetitionId|undefined){
            if(id==="ENG1")return 125_000_000;if(id==="ESP1")return 82_000_000;if(id==="FRA1")return 62_000_000;
            if(id==="BRA1")return 42_000_000;if(id==="ENG2")return 34_000_000;if(id==="ESP2")return 26_000_000;
            if(id==="FRA2")return 22_000_000;if(id==="BRA2")return 15_000_000;return 8_000_000;
          }
          function continentalImpact(clubId:string,world:WorldCompetitionsState){let reputation=0,prizeSignal=0;for(const t of world.tournaments){const participant=t.participants.find(p=>p.activeClubId===clubId);if(!participant)continue;const matches=t.matches.filter(m=>m.played&&(m.home.activeClubId===clubId||m.away.activeClubId===clubId));if(!matches.length)continue;const champion=t.championId===participant.id,final=matches.some(m=>m.stage==="Final"),semi=matches.some(m=>m.stage==="Semifinal"),quarters=matches.some(m=>m.stage==="Quartas de final");if(champion){reputation+=3;prizeSignal+=18_000_000;}else if(final){reputation+=2;prizeSignal+=10_000_000;}else if(semi){reputation+=1.2;prizeSignal+=6_000_000;}else if(quarters){reputation+=.6;prizeSignal+=3_000_000;}}return{reputation,prizeSignal};}
          function playerValue(overall:number,value:number|null){return value??Math.max(250_000,(overall-52)*520_000);}

          export function evolveClubDynamics(league:LeagueWorld,year:number,world:WorldCompetitionsState,advanced:AdvancedWorldState,clubAi:ClubAiState|undefined,value:ClubDynamicsState|undefined){
            const state=structuredClone(hydrateClubDynamics(value));if(state.lastEvolvedYear===year)return state;const table=[...league.standings].sort((a,b)=>b.points-a.points||(b.goalsFor-b.goalsAgainst)-(a.goalsFor-a.goalsAgainst)||b.goalsFor-a.goalsFor),repOrder=[...league.clubs].sort((a,b)=>b.reputation-a.reputation),n=Math.max(1,league.clubs.length),competitionId=(league.competitionId??"BRA1") as ProfessionalCompetitionId;
            for(const club of league.clubs){const position=Math.max(1,table.findIndex(r=>r.clubId===club.id)+1),expected=Math.max(1,repOrder.findIndex(c=>c.id===club.id)+1),continental=continentalImpact(club.id,world),overperformance=clamp((expected-position)*.45,-2.2,2.2),tableDelta=position===1?3.2:position<=4?1.8:position<=Math.ceil(n*.45)?.7:position>=n-2?-2.3:position>=Math.ceil(n*.8)?-1.1:0,reputationBefore=club.reputation,reputationDelta=Math.round(clamp(tableDelta+overperformance+continental.reputation,-5,5)*10)/10,reputationAfter=clamp(Math.round((reputationBefore+reputationDelta)*10)/10,42,97),marketValueBefore=club.marketValueEur,squadValue=club.players.reduce((sum,p)=>sum+playerValue(p.overall,p.marketValueEur),0),marketValueAfter=round100k(Math.max(3_000_000,marketValueBefore*.62+squadValue*.38*(1+reputationDelta*.012))),transferBudgetBefore=club.transferBudgetEur,wageBudgetBefore=club.wageBudgetBrlMonthly,wageSpend=club.players.reduce((sum,p)=>sum+p.contract.salaryBrlMonthly,0),finance=advanced.finances[club.id],baseRevenue=competitionBase(competitionId),performanceFactor=1.18-(position-1)/Math.max(1,n-1)*.34,commercial=Math.max(2_000_000,reputationAfter*reputationAfter*3200),estimatedRevenueEur=Math.round(baseRevenue*performanceFactor+commercial+continental.prizeSignal+Math.max(0,finance?.prizeMoneyEur??0)),estimatedExpensesEur=Math.round(wageSpend*12/6+marketValueAfter*.032),operatingResultEur=estimatedRevenueEur-estimatedExpensesEur,allocation=Math.max(900_000,marketValueAfter*.026+Math.max(0,operatingResultEur)*.16),transferBudgetAfter=round100k(Math.max(750_000,(transferBudgetBefore*.45+allocation)*(operatingResultEur<0?.88:1)*(1+reputationDelta*.025))),wageGrowth=clamp(1.025+reputationDelta*.014,.94,1.13),wageBudgetAfter=Math.round(Math.max(wageSpend*1.07,wageBudgetBefore*wageGrowth)/10_000)*10_000,manager=clubAi?.managers.find(m=>m.clubId===club.id),summary=reputationDelta>=2?"O clube valorizou esportivamente e ganhou poder de mercado.":reputationDelta<=-2?"A temporada reduziu prestígio e apertou a capacidade de investimento.":operatingResultEur>=0?"O clube fechou o ciclo de forma estável e sustentável.":"O desempenho esportivo segurou parte da pressão financeira.";
              club.reputation=reputationAfter;club.marketValueEur=marketValueAfter;club.transferBudgetEur=transferBudgetAfter;club.wageBudgetBrlMonthly=wageBudgetAfter;const point:ClubTrendPoint={year,clubName:club.name,competitionId,position,reputationBefore,reputationAfter,reputationDelta,marketValueBefore,marketValueAfter,transferBudgetBefore,transferBudgetAfter,wageBudgetBefore,wageBudgetAfter,estimatedRevenueEur,estimatedExpensesEur,operatingResultEur,managerName:manager?.managerName,managerStyle:manager?.style,summary},k=key(club.name);state.history[k]=[point,...(state.history[k]??[]).filter(x=>x.year!==year)].slice(0,30);
            }
            state.lastEvolvedYear=year;return state;
          }
          EOF

          cat > src/app/pwa-client.tsx <<'EOF'
          "use client";
          import { useEffect, useState } from "react";
          import { CheckCircle2, Download, Wifi, WifiOff } from "lucide-react";
          import styles from "./pwa-client.module.css";

          type InstallEvent=Event&{prompt:()=>Promise<void>;userChoice:Promise<{outcome:"accepted"|"dismissed"}>};
          type NavigatorStandalone=Navigator&{standalone?:boolean};
          export default function PwaClient(){
            const[online,setOnline]=useState(true),[ready,setReady]=useState(false),[installEvent,setInstallEvent]=useState<InstallEvent|null>(null),[installed,setInstalled]=useState(false);
            useEffect(()=>{const timer=window.setTimeout(()=>{setOnline(navigator.onLine);setInstalled(window.matchMedia("(display-mode: standalone)").matches||Boolean((navigator as NavigatorStandalone).standalone));},0),onOnline=()=>setOnline(true),onOffline=()=>setOnline(false),onInstall=(event:Event)=>{event.preventDefault();setInstallEvent(event as InstallEvent);},onInstalled=()=>{setInstalled(true);setInstallEvent(null);};window.addEventListener("online",onOnline);window.addEventListener("offline",onOffline);window.addEventListener("beforeinstallprompt",onInstall);window.addEventListener("appinstalled",onInstalled);if("serviceWorker"in navigator){navigator.serviceWorker.register("/sw.js",{scope:"/"}).then(async registration=>{await navigator.serviceWorker.ready;setReady(Boolean(navigator.serviceWorker.controller||registration.active));registration.active?.postMessage({type:"CACHE_APP_SHELL"});try{await navigator.storage?.persist?.();}catch{}}).catch(()=>setReady(false));navigator.serviceWorker.addEventListener("controllerchange",()=>setReady(true));}return()=>{window.clearTimeout(timer);window.removeEventListener("online",onOnline);window.removeEventListener("offline",onOffline);window.removeEventListener("beforeinstallprompt",onInstall);window.removeEventListener("appinstalled",onInstalled);};},[]);
            async function install(){if(!installEvent)return;await installEvent.prompt();const result=await installEvent.userChoice;if(result.outcome==="accepted")setInstalled(true);setInstallEvent(null);}
            const label=!online?"MODO OFFLINE":ready?"OFFLINE PRONTO":"PREPARANDO OFFLINE";
            return <aside className={`${styles.shell} ${!online?styles.offline:""}`} aria-live="polite"><span>{!online?<WifiOff/>:ready?<CheckCircle2/>:<Wifi/>}<b>{label}</b></span>{installEvent&&!installed&&<button onClick={install}><Download/> INSTALAR</button>}</aside>;
          }
          EOF

          cat > src/app/pwa-client.module.css <<'EOF'
          .shell{position:fixed;right:14px;bottom:14px;z-index:90;display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid rgba(255,255,255,.13);border-radius:12px;background:rgba(7,17,15,.9);backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.18);color:#d9ff43;font-size:8px;letter-spacing:.06em}.shell span{display:flex;align-items:center;gap:6px}.shell svg{width:13px;height:13px}.shell button{display:flex;align-items:center;gap:5px;border:0;border-radius:8px;background:#d9ff43;color:#07110f;font:inherit;font-weight:900;padding:6px 8px;cursor:pointer}.offline{color:#fff;background:rgba(91,45,15,.94)}@media(max-width:720px){.shell{right:8px;bottom:8px}.shell b{font-size:7px}}
          EOF

          cat > public/sw.js <<'EOF'
          const CACHE="v90-offline-shell-v2";
          const CORE=["/","/manifest.webmanifest","/icon-192.png","/icon-512.png","/icon-maskable-512.png"];
          const sameOrigin=url=>new URL(url,self.location.origin).origin===self.location.origin;
          async function store(cache,request,response){if(response&&(response.ok||response.type==="opaque"))await cache.put(request,response.clone());return response;}
          async function cacheShell(){const cache=await caches.open(CACHE);await Promise.allSettled(CORE.slice(1).map(async url=>store(cache,url,await fetch(url,{cache:"reload"}))));try{const response=await fetch("/",{cache:"reload"});if(!response.ok)return;await cache.put("/",response.clone());const html=await response.text(),assets=[...html.matchAll(/(?:src|href)="([^"]+)"/g)].map(match=>match[1]).filter(url=>url.startsWith("/")&&sameOrigin(url));await Promise.allSettled([...new Set(assets)].map(async url=>store(cache,url,await fetch(url,{cache:"reload"}))));}catch{}}
          self.addEventListener("install",event=>{event.waitUntil(cacheShell().then(()=>self.skipWaiting()));});
          self.addEventListener("activate",event=>{event.waitUntil((async()=>{for(const key of await caches.keys())if(key.startsWith("v90-offline-")&&key!==CACHE)await caches.delete(key);await self.clients.claim();})());});
          self.addEventListener("message",event=>{if(event.data?.type==="CACHE_APP_SHELL")event.waitUntil(cacheShell());});
          async function cacheFirst(request){const cache=await caches.open(CACHE),hit=await cache.match(request);if(hit)return hit;try{return await store(cache,request,await fetch(request));}catch{return new Response("",{status:504});}}
          async function staleWhileRevalidate(request){const cache=await caches.open(CACHE),hit=await cache.match(request),network=fetch(request).then(response=>store(cache,request,response)).catch(()=>undefined);return hit??await network??new Response("",{status:504});}
          async function navigation(request){const cache=await caches.open(CACHE);try{const response=await fetch(request);if(response.ok)await cache.put("/",response.clone());return response;}catch{return await cache.match(request)??await cache.match("/")??new Response("Vestiário 90 ainda não foi preparado para uso offline. Abra o jogo uma vez conectado.",{status:503,headers:{"Content-Type":"text/plain; charset=utf-8"}});}}
          self.addEventListener("fetch",event=>{const request=event.request;if(request.method!=="GET")return;const url=new URL(request.url);if(request.mode==="navigate"){event.respondWith(navigation(request));return;}if(url.origin===self.location.origin){if(url.pathname.startsWith("/_next/static/")||url.pathname.startsWith("/icon-")||url.pathname==="/manifest.webmanifest"){event.respondWith(cacheFirst(request));return;}event.respondWith(staleWhileRevalidate(request));return;}if(request.destination==="image")event.respondWith(cacheFirst(request));});
          EOF

          python - <<'PY'
          from pathlib import Path
          import struct,zlib
          def make_png(path,size,maskable=False):
              bg=(7,24,17,255); lime=(217,255,67,255); white=(244,249,246,255); rows=[]
              for y in range(size):
                  row=bytearray([0])
                  for x in range(size):
                      nx=x/size; ny=y/size; c=bg
                      inset=.15 if maskable else .08
                      shield=(nx>inset and nx<1-inset and ny>inset and ny<.78 and abs(nx-.5)<(.43-(ny-inset)*.28))
                      if shield:c=lime
                      ring=(x-size/2)**2+(y-size*.46)**2
                      if shield and ring<(size*.22)**2:c=white
                      if shield and ring<(size*.145)**2:c=bg
                      if shield and (abs(x-size*.5)<size*.025 or abs(y-size*.46)<size*.025) and ring<(size*.14)**2:c=lime
                      row.extend(c)
                  rows.append(bytes(row))
              raw=b''.join(rows)
              def chunk(kind,data):return struct.pack('>I',len(data))+kind+data+struct.pack('>I',zlib.crc32(kind+data)&0xffffffff)
              png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',size,size,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
              Path(path).write_bytes(png)
          make_png('public/icon-192.png',192)
          make_png('public/icon-512.png',512)
          make_png('public/icon-maskable-512.png',512,True)
          PY

      - name: Deepen AI market, board pressure and multi-year progression
        run: |
          cat > src/game-engine/active-board.ts <<'EOF'
          import type { LeagueClub, LeagueWorld } from "./league";
          import { sortedStandings } from "./league";
          import type { SeasonState } from "./season";
          import type { LivingWorldState, WorldInboxEvent, WorldNews } from "./world-events";

          export type BoardObjectiveStatus="No caminho"|"Atenção"|"Cumprida"|"Falhou";
          export type BoardObjective={id:string;category:"Liga"|"Copas"|"Elenco"|"Finanças"|"Base";title:string;description:string;priority:"Essencial"|"Alta"|"Média";progress:number;status:BoardObjectiveStatus};
          export type BoardEvaluation={id:string;round:number;date:string;score:number;verdict:"Excelente"|"Positiva"|"Estável"|"Sob pressão"|"Crítica";summary:string;position:number;targetPosition:number;form:string;boardConfidence:number};
          export type BoardMeeting={id:string;eventId:string;round:number;date:string;title:string;agenda:string[];status:"Pendente"|"Realizada"};
          export type BoardStatement={id:string;round:number;date:string;tone:"positive"|"neutral"|"negative";headline:string;body:string};
          export type BoardSeasonContext={promoted?:boolean;relegated?:boolean;previousPosition?:number;reputationDelta?:number};
          export type BoardMandate={name:string;description:string;patience:number;pressure:"Baixa"|"Moderada"|"Alta";nonNegotiables:string[]};
          export type ActiveBoardState={season:number;clubId:string;philosophy:string;targetPosition:number;mandate:BoardMandate;objectives:BoardObjective[];evaluations:BoardEvaluation[];meetings:BoardMeeting[];statements:BoardStatement[];lastEvaluationRound?:number;lastUltimatumRound?:number};

          const clamp=(v:number)=>Math.max(0,Math.min(100,Math.round(v)));
          function expectedPosition(club:LeagueClub,league:LeagueWorld){const rank=[...league.clubs].sort((a,b)=>b.reputation-a.reputation).findIndex(c=>c.id===club.id)+1,n=league.clubs.length;if(rank<=3)return Math.min(4,n);if(rank<=6)return Math.min(6,n);if(rank<=Math.ceil(n*.55))return Math.min(10,n);return Math.min(15,n);}
          function mandateFor(club:LeagueClub,league:LeagueWorld,context:BoardSeasonContext={}){const n=league.clubs.length,rank=[...league.clubs].sort((a,b)=>b.reputation-a.reputation).findIndex(c=>c.id===club.id)+1;let target=expectedPosition(club,league),mandate:BoardMandate;if(context.relegated){target=Math.min(2,n);mandate={name:"Acesso imediato",description:"A queda mudou o contexto: a diretoria exige reação esportiva e retorno à divisão superior.",patience:38,pressure:"Alta",nonNegotiables:["Brigar pelo acesso","Preservar os principais ativos"]};}else if(context.promoted){target=Math.min(n-3,Math.max(11,target));mandate={name:"Consolidar a permanência",description:"O clube subiu de nível e aceita um ciclo de adaptação, desde que a equipe permaneça competitiva.",patience:74,pressure:"Moderada",nonNegotiables:["Evitar o rebaixamento","Não romper o teto salarial"]};}else if(rank<=3){target=Math.min(3,n);mandate={name:"Disputar títulos",description:"Elenco, reputação e orçamento colocam o clube sob obrigação de competir no topo.",patience:43,pressure:"Alta",nonNegotiables:["Brigar pelo título","Chegar forte aos mata-matas"]};}else if(rank<=6){target=Math.min(6,n);mandate={name:"Vaga continental",description:"A diretoria espera presença constante na faixa continental e evolução em jogos grandes.",patience:55,pressure:"Moderada",nonNegotiables:["Classificação continental","Elenco competitivo"]};}else{mandate={name:"Crescimento sustentável",description:"O clube quer subir degraus sem comprometer orçamento, vestiário e desenvolvimento de ativos.",patience:66,pressure:"Baixa",nonNegotiables:["Superar a expectativa da liga","Manter sustentabilidade"]};}if((context.reputationDelta??0)>=3&&!context.promoted)target=Math.max(1,target-1);return{target,mandate};}
          function objectives(target:number,mandate:BoardMandate):BoardObjective[]{const title=mandate.name==="Disputar títulos"?"Disputar o título até o fim":mandate.name==="Acesso imediato"?"Terminar na zona de acesso":mandate.name==="Consolidar a permanência"?"Permanecer fora da zona de queda":`Terminar entre os ${target} primeiros`;return[
            {id:"league",category:"Liga",title,description:"A posição na liga é a principal régua esportiva da temporada.",priority:"Essencial",progress:0,status:"No caminho"},
            {id:"cups",category:"Copas",title:mandate.pressure==="Alta"?"Chegar às fases decisivas das copas":"Ser competitivo nas copas",description:"A diretoria compara a campanha de mata-mata à força e ao investimento do elenco.",priority:mandate.pressure==="Alta"?"Essencial":"Alta",progress:50,status:"No caminho"},
            {id:"squad",category:"Elenco",title:"Manter o vestiário competitivo",description:"Moral, confiança e gestão de minutos precisam permanecer sob controle.",priority:"Alta",progress:70,status:"No caminho"},
            {id:"finance",category:"Finanças",title:"Respeitar a estrutura salarial",description:"O gasto mensal do elenco deve permanecer dentro do teto aprovado.",priority:"Alta",progress:80,status:"No caminho"},
            {id:"youth",category:"Base",title:"Desenvolver ativos jovens",description:"A diretoria valoriza minutos e evolução para atletas de até 21 anos.",priority:"Média",progress:40,status:"No caminho"},
          ];}
          export function createActiveBoard(club:LeagueClub,league:LeagueWorld,year:number,context:BoardSeasonContext={}):ActiveBoardState{const{target,mandate}=mandateFor(club,league,context);return{season:year,clubId:club.id,philosophy:mandate.description,targetPosition:target,mandate,objectives:objectives(target,mandate),evaluations:[],meetings:[],statements:[]};}
          export function hydrateActiveBoard(value:ActiveBoardState|undefined,state:SeasonState){const club=state.league.clubs.find(c=>c.id===state.selectedClubId)??state.league.clubs[0];if(!value||value.season!==state.year||value.clubId!==club.id)return createActiveBoard(club,state.league,state.year);const fallback=mandateFor(club,state.league).mandate;return{...value,mandate:value.mandate??fallback,objectives:(value.objectives?.length?value.objectives:objectives(value.targetPosition,fallback)).map(o=>({...o})),evaluations:[...(value.evaluations??[])],meetings:[...(value.meetings??[])],statements:[...(value.statements??[])]};}
          function addEvent(world:LivingWorldState,event:Omit<WorldInboxEvent,"createdOrder">){const order=world.sequence+1;return{...world,sequence:order,inbox:[{...event,createdOrder:order},...world.inbox].slice(0,80)};}
          function addNews(world:LivingWorldState,news:Omit<WorldNews,"createdOrder">){const order=world.sequence+1;return{...world,sequence:order,news:[{...news,createdOrder:order},...world.news].slice(0,110)};}
