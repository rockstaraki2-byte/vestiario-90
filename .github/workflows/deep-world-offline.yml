          export function processActiveBoardAfterRound(state:SeasonState):SeasonState{if(state.career?.status!=="Empregado")return state;const completedRound=Math.max(0,state.currentRound-1),board=hydrateActiveBoard(state.boardState,state),threeLosses=state.recentForm.slice(-3).join("")==="DDD",cadence=board.mandate.pressure==="Alta"?3:board.mandate.pressure==="Baixa"?5:4;if(completedRound<=0||board.lastEvaluationRound===completedRound||(completedRound%cadence!==0&&!threeLosses))return{...state,boardState:board};const club=state.league.clubs.find(c=>c.id===state.selectedClubId)!,table=sortedStandings(state.league),position=table.findIndex(s=>s.clubId===club.id)+1,updatedObjectives=updateObjectives(board,state,position),leagueScore=clamp(78-(position-board.targetPosition)*9),formScore=clamp(55+state.recentForm.reduce((s,r)=>s+(r==="V"?9:r==="D"?-8:1),0)),morale=Math.round(club.players.reduce((s,p)=>s+p.morale,0)/Math.max(1,club.players.length)),wage=club.players.reduce((s,p)=>s+p.contract.salaryBrlMonthly,0),financeScore=wage<=club.wageBudgetBrlMonthly?82:clamp(78-(wage/club.wageBudgetBrlMonthly-1)*180),essentialFailures=updatedObjectives.filter(o=>o.priority==="Essencial"&&o.status==="Falhou").length,gap=Math.max(0,position-board.targetPosition),pressurePenalty=Math.round(gap*Math.max(0,70-board.mandate.patience)/12+essentialFailures*8),score=clamp(leagueScore*.42+formScore*.25+morale*.18+financeScore*.15-pressurePenalty),verdict:BoardEvaluation["verdict"]=score>=82?"Excelente":score>=68?"Positiva":score>=54?"Estável":score>=38?"Sob pressão":"Crítica",form=state.recentForm.join(" ")||"—",summary=score>=68?`A diretoria entende que o trabalho segue alinhado ao mandato “${board.mandate.name}”. O ${club.name} ocupa a ${position}ª posição.`:score>=54?`O trabalho ainda está em uma faixa aceitável, mas o mandato “${board.mandate.name}” exige sinais concretos de evolução.`:`A diretoria considera o momento incompatível com o mandato “${board.mandate.name}”. Resultados e obje