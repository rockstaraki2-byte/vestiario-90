name: Temporary world participant matching patch

on:
  push:
    branches:
      - feat/sprint1-long-term-stability-v2
    paths:
      - ".github/workflows/tmp-fix-world-equivalence.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sprint1-long-term-stability-v2
      - name: Tighten participant name matching
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/game-engine/world-competitions.ts')
          s=p.read_text()
          old='function equivalent(a:string,b:string){let x=NAME_EQUIV[normalize(a)]??normalize(a),y=NAME_EQUIV[normalize(b)]??normalize(b);return x===y||x.includes(y)||y.includes(x);}'
          new='function equivalent(a:string,b:string){let x=NAME_EQUIV[normalize(a)]??normalize(a),y=NAME_EQUIV[normalize(b)]??normalize(b);if(x===y)return true;const shorter=x.length<=y.length?x:y,longer=x.length<=y.length?y:x;return shorter.includes(" ")&&shorter.length>=8&&longer.includes(shorter);}'
          if old not in s:
              raise SystemExit('target equivalent() implementation not found')
          p.write_text(s.replace(old,new))
          PY
          git rm .github/workflows/tmp-fix-world-equivalence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-engine/world-competitions.ts
          git commit -m "fix(cups): avoid ambiguous participant name collisions"
          git push origin HEAD:feat/sprint1-long-term-stability-v2
