name: Career settings upgrade
on:
  push:
    branches: [main]
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply career settings
        run: python scripts/apply-career-settings.py
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit validated changes
        run: |
          rm scripts/apply-career-settings.py .github/workflows/career-settings-upgrade.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add per-save staff responsibilities and match settings'
          git push
