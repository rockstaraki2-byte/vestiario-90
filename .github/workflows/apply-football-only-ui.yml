name: Apply football-only flow and UI
on:
  push:
    branches: [feat/football-only-flow-ui]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/football-only-flow-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply gameplay cleanup and UX pass
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()
          def write(path, text):
              Path(path).write_text(text)

          write('src/game-engine/narrative.ts', '''import type { LeagueWorld } from "./league";\nimport type { LivingWorldState } from "./world-events";\n\nexport type NarrativeContext={day:number;round:number;selectedClubId:string;seed:string;league:LeagueWorld};\n\n/**\n * Legacy calendar hook kept for save compatibility. Daily off-field random\n * interruptions were removed: the manager now reacts to football events,\n * board/player matters and official pre/post-match press conferences only.\n */\nexport function applyNarrativeDay(world:LivingWorldState,context:NarrativeContext):LivingWorldState{\n  const dayKey=context.round*100+context.day;\n  if(world.lastNarrativeDay===dayKey)return world;\n  return{...world,lastNarrativeDay:dayKey};\n}\n''')

          p='src/game-engine/advanced-world.ts';t=read(p)
