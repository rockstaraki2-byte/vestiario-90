          old='<><div className={styles.kpis}>';new='''<><button className={styles.commandBar} onClick={()=>setActive(managerAction.target)}><span><Zap size={17}/><small>{managerAction.kicker}</small><b>{managerAction.title}</b></span><div><em>{managerAction.detail}</em><ChevronRight size={18}/></div></button><div className={styles.kpis}>'''
          if old not in t: raise SystemExit('overview kpis target missing')
          t=t.replace(old,new,1)
          old='<nav className={styles.mobileNav}>{NAV.slice(0,5).map(([label,Icon])=><button key={label} onClick={()=>{setActive(label);setMatch(null)}} className={active===label?styles.mobileActive:""}><Icon size={20}/><span>{label.split(" ")[0]}</span></button>)}</nav>'
          new='''<nav className={styles.mobileNav}>{NAV.filter(([label])=>label==="Visão geral"||label==="Elenco"||label==="Táticas"||label==="Calendário").map(([label,Icon])=><button key={label} onClick={()=>{setActive(label);setMatch(null);setMoreOpen(false)}} className={active===label?styles.mobileActive:""}><Icon size={20}/><span>{label.split(" ")[0]}</span></button>)}<button onClick={()=>setMoreOpen(value=>!value)} className={moreOpen?styles.mobileActive:""}><LayoutGrid size={20}/><span>Mais</span></button></nav>{moreOpen&&<div className={styles.mobileMenuBackdrop} onClick={()=>setMoreOpen(false)}><section className={styles.mobileMenu} onClick={event=>event.stopPropagation()}><header><div><span>NAVEGAÇÃO</span><b>Módulos do treinador</b></div><button onClick={()=>setMoreOpen(false)}>Fechar</button></header><div className={styles.mobileMenuGrid}>{NAV.filter(([label])=>label!=="Visão geral"&&label!=="Elenco"&&label!=="Táticas"&&label!=="Calendário").map(([label,Icon])=><button key={label} onClick={()=>{setActive(label);setMatch(null);setMoreOpen(false)}} className={active===label?styles.mobileMenuActive:""}><Icon size={19}/><span>{label}</span>{label==="Caixa de entrada"&&pendingEvents.length>0&&<i>{Math.min(99,pendingEvents.length)}</i>}{label==="Mídia & Redes"&&pendingMedia.length>0&&<i>{Math.min(9,pendingMedia.length)}</i>}</button>)}</div></section></div>}'''
          if old not in t: raise SystemExit('mobile nav target missing')
          write(p,t.replace(old,new,1))

          p='src/app/page.module.css';t=read(p);t+='''\n\n/* Action-first dashboard and mobile navigation refresh */\n.commandBar{width:100%;border:1px solid #31584c;background:linear-gradient(135deg,#102a23,#0c1e1a);color:#eef8f4;border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:18px;text-align:left;cursor:pointer;box-shadow:0 10px 28px #02090742;transition:transform .15s ease,border-color .15s ease,background .15s ease}.commandBar:hover{transform:translateY(-1px);border-color:#6c907f}.commandBar>span{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:8px;min-width:220px}.commandBar>span svg{grid-row:1/3;color:#d9ff43}.commandBar small{font-size:8px;font-weight:900;letter-spacing:.12em;color:#9eb9ad}.commandBar b{font-size:13px;line-height:1.25}.commandBar>div{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0}.commandBar em{font-style:normal;font-size:10px;line-height:1.35;color:#b9cbc4;max-width:560px}.mobileMenuBackdrop{display:none}\n@media(max-width:720px){.sidebar{display:none!important}.content{padding-top:20px!important;padding-bottom:96px}.toast{top:72px!important}.commandBar{align-items:flex-start;flex-direction:column;gap:9px;padding:13px}.commandBar>span{min-width:0}.commandBar>div{width:100%;justify-content:space-between}.commandBar em{font-size:9px}.mobileNav{grid-template-columns:repeat(5,1fr)!important;z-index:91}.mobileMenuBackdrop{display:flex;position:fixed;inset:0;background:#020706b8;backdrop-filter:blur(4px);align-items:flex-end;z-index:90}.mobileMenu{width:100%;max-height:76vh;overflow:auto;background:#0b1714;color:#eff8f4;border:1px solid #2c483f;border-bottom:0;border-radius:20px 20px 0 0;padding:15px 14px 90px;box-shadow:0 -22px 60px #0009}.mobileMenu>header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.mobileMenu>header div{display:grid}.mobileMenu>header span{font-size:8px;font-weight:900;letter-spacing:.13em;color:#7fa294}.mobileMenu>header b{font-size:15px;margin-top:2px}.mobileMenu>header button{border:1px solid #345149;background:#13251f;color:#dfece7;border-radius:9px;padding:7px 10px;font-size:9px;font-weight:800}.mobileMenuGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.mobileMenuGrid>button{position:relative;min-height:54px;border:1px solid #244138;background:#10231d;color:#d9e7e2;border-radius:11px;padding:9px 10px;display:flex;align-items:center;gap:8px;text-align:left;font-size:9px;font-weight:800}.mobileMenuGrid>button svg{flex:0 0 auto;color:#8faf9f}.mobileMenuGrid>button i{position:absolute;right:7px;top:6px;min-width:17px;height:17px;border-radius:9px;background:#d9ff43;color:#112019;display:grid;place-items:center;font-size:8px;font-style:normal}.mobileMenuGrid>button.mobileMenuActive{border-color:#d9ff43;background:#193328;color:#fff}.mobileMenuGrid>button.mobileMenuActive svg{color:#d9ff43}}\n''';write(p,t)

          p='src/app/globals.css';t=read(p);t=t.replace(':root{--background:#07110f;--foreground:#edf7f3;color-scheme:dark}',':root{--background:#07110f;--foreground:#edf7f3;--surface:#0d1c18;--surface-2:#13251f;--muted:#92a79e;--border:#29443b;--accent:#d9ff43;color-scheme:dark}',1);t+='''\nbutton{transition:filter .15s ease,transform .15s ease}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:active{transform:translateY(1px)}::selection{background:#d9ff43;color:#102018}\n''';write(p,t)

          write('src/game-engine/narrative.test.ts','''import{describe,expect,it}from"vitest";import{createLeague}from"./league";import{createLivingWorld}from"./world-events";import{applyNarrativeDay}from"./narrative";\ndescribe("NarrativeProvider",()=>{const league=createLeague("narrativa"),club=league.clubs[0];it("não duplica processamento no mesmo dia",()=>{const world=createLivingWorld(club.name),ctx={day:18,round:1,selectedClubId:club.id,seed:"narrativa",league};const once=applyNarrativeDay(world,ctx),twice=applyNarrativeDay(once,ctx);expect(twice).toEqual(once)});it("não cria hotel, programa, patrocinador ou logística aleatória",()=>{let world=createLivingWorld(club.name);const initialInbox=world.inbox.length,initialNews=world.news.length;for(let day=1;day<=31;day++)world=applyNarrativeDay(world,{day,round:1,selectedClubId:club.id,seed:"narrativa-semana",league});expect(world.inbox.length).toBe(initialInbox);expect(world.news.length).toBe(initialNews)});});\n''')
          write('src/game-engine/career.test.ts','''import{describe,expect,it}from"vitest";\nimport{applyCareerChoice,careerAfterRound,createManagerCareer}from"./career";\nimport{createLeague}from"./league";\nimport{createLivingWorld}from"./world-events";\n\ndescribe("manager career",()=>{\n const league=createLeague("career-tests",2026),club=league.clubs[0];\n it("começa empregado com histórico aberto",()=>{const career=createManagerCareer(club,2026);expect(career.status).toBe("Empregado");expect(career.currentClubId).toBe(club.id);expect(career.spells).toHaveLength(1)});\n it("demite o treinador quando segurança e diretoria entram em nível crítico",()=>{const career=createManagerCareer(club,2026);career.jobSecurity=17;let world=createLivingWorld(club.name);world={...world,boardConfidence:13};const result=careerAfterRound(career,league,world,8,2026,"dismiss",{goalsFor:0,goalsAgainst:3});expect(result.career.status).toBe("Sem clube");expect(result.career.dismissals).toBe(1);expect(result.world.inbox.some(event=>event.kind==="Carreira"&&event.title.includes("Fim da passagem"))).toBe(true)});\n it("gera proposta direta para treinador sem clube sem entrevista",()=>{const career=createManagerCareer(club,2026);career.status="Sem clube";career.currentClubId=undefined;career.lastDismissalRound=6;const result=careerAfterRound(career,league,createLivingWorld(club.name),7,2026,"unemployed");const offer=result.world.inbox.find(event=>event.kind==="Carreira"&&event.choices.some(choice=>choice.careerAction==="accept-job"));expect(offer).toBeTruthy();expect(result.world.inbox.some(event=>event.choices.some(choice=>choice.careerAction==="accept-interview"))).toBe(false)});\n it("permite assumir um clube a partir da proposta formal",()=>{const career=createManagerCareer(club,2026);career.status="Sem clube";career.currentClubId=undefined;career.lastDismissalRound=6;const round=careerAfterRound(career,league,createLivingWorld(club.name),7,2026,"hire-direct");const offer=round.world.inbox.find(event=>event.kind==="Carreira"&&event.choices.some(choice=>choice.careerAction==="accept-job"))!;const accept=offer.choices.find(choice=>choice.careerAction==="accept-job")!;const hired=applyCareerChoice(round.career,league,round.world,accept,7,2026,"hire-direct");expect(hired.career.status).toBe("Empregado");expect(hired.nextClubId).toBeTruthy();expect(hired.career.currentClubId).toBe(hired.nextClubId)});\n});\n''')
          p='src/game-engine/advanced-world.test.ts';t=read(p);t=t.replace('it("gera eventos de vida e preserva histórico de temporadas",()=>','it("não gera eventos pessoais aleatórios e preserva histórico de temporadas",()=>',1).replace('expect(state.lifeEvents.length).toBe(1);','expect(state.lifeEvents.length).toBe(0);',1);write(p,t)
