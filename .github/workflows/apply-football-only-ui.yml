 diário permanece silencioso",()=>{const state=createSeason("quiet-hook",2026),before=structuredClone(state.livingWorld),next=applyNarrativeDay(before,{day:12,round:state.currentRound,selectedClubId:state.selectedClubId,seed:state.baseSeed,league:state.league});expect(next.inbox).toEqual(before.inbox);expect(next.news).toEqual(before.news);expect(next.lastNarrativeDay).toBe(112)});\n});\n''')
