          addition='''latestNews=season.livingWorld.news.slice(0,3);\n  const preMatchMedia=pendingMedia.find(session=>session.format==="Coletiva pré-jogo"),postMatchMedia=pendingMedia.find(session=>session.format==="Coletiva pós-jogo"),todayMatch=Boolean(todayFixture||todayCup),selectionReady=matchdaySelectionReady(season),attention=pendingEvents[0];\n  const managerAction=preMatchMedia?{target:"Mídia & Redes",kicker:"COLETIVA PRÉ-JOGO",title:"Responder antes da partida",detail:preMatchMedia.context}:postMatchMedia?{target:"Mídia & Redes",kicker:"COLETIVA PÓS-JOGO",title:"Fechar a repercussão da partida",detail:postMatchMedia.context}:todayMatch&&!selectionReady?{target:"Táticas",kicker:"CONVOCAÇÃO",title:"Finalizar titulares e banco",detail:"A partida é hoje e a relação de jogo ainda precisa ser fechada."}:todayMatch?{target:"Táticas",kicker:"DIA DE JOGO",title:"Preparar e iniciar a partida",detail:opponent?`Próximo adversário: ${opponent.name}.`:"Partida disponível para preparação."}:attention?{target:attention.kind==="Diretoria"?"Clube":"Caixa de entrada",kicker:"PRECISA DA SUA ATENÇÃO",title:attention.title,detail:attention.body}:currentFixture?{target:"Calendário",kicker:"PRÓXIMO COMPROMISSO",title:opponent?`Preparar para ${opponent.name}`:"Revisar a agenda",detail:`Jogo marcado para ${formatDate(currentFixture.date??season.currentDate)}.`}:{target:"Calendário",kicker:"AGENDA",title:"Revisar próximos compromissos",detail:"Não há decisão obrigatória neste momento."};'''
          if marker not in t: raise SystemExit('latestNews marker missing')
