          old='export function processAdvancedDay(state:AdvancedWorldState|undefined,league:LeagueWorld,clubId:string,date:string,dayNumber:number,seed:string,year:number){const next=structuredClone(hydrateAdvancedWorld(state,league,seed,year));updateMedical(next,league);maybeLifeEvent(next,league,clubId,date,dayNumber,seed);chargeWages(next,league,clubId,date);return next;}'
          new='export function processAdvancedDay(state:AdvancedWorldState|undefined,league:LeagueWorld,clubId:string,date:string,dayNumber:number,seed:string,year:number){void dayNumber;const next=structuredClone(hydrateAdvancedWorld(state,league,seed,year));updateMedical(next,league);chargeWages(next,league,clubId,date);return next;}'
          if old not in t: raise SystemExit('processAdvancedDay target not found')
          write(p,t.replace(old,new,1))

