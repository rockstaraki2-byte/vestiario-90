          new='sessions:(value.sessions??[]).filter(session=>session.format==="Coletiva pré-jogo"||session.format==="Coletiva pós-jogo").map(session=>({...session,questions:session.questions.map(question=>({...question,choices:question.choices.map(choice=>({...choice,effect:{...choice.effect}}))})),transcript:[...session.transcript]}))'
