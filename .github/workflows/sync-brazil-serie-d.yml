name: Sync Brasileirao Serie D rosters
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/refresh-brazil-serie-d-2026.mjs"
      - ".github/workflows/sync-brazil-serie-d.yml"
permissions:
  contents: write
concurrency:
  group: v90-brazil-serie-d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh Serie D squads
        run: node scripts/refresh-brazil-serie-d-2026.mjs
      - name: Validate snapshot
        run: |
          SNAPSHOT_DATE=$(TZ=America/Sao_Paulo date +%F)
          test -s src/data/brazil-2026/serie-d.ts
          grep -q "$SNAPSHOT_DATE" src/data/brazil-2026/serie-d.ts
          grep -q '"clubs":96' src/data/brazil-2026/serie-d.ts
          grep -q 'BRAZIL_SERIE_D_2026_SYNC_ERRORS' src/data/brazil-2026/serie-d.ts
          npm test
          npm run build
      - name: Commit Serie D snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/brazil-2026/serie-d.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh Brasileirao Serie D squads"
          git pull --rebase origin main
          git push origin HEAD:main
