name: Apply world navigation upgrade
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/apply-world-club-navigation.mjs"
      - "src/app/world-entity-profile.tsx"
      - ".github/workflows/apply-world-navigation-upgrade.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply navigation patch
        run: node scripts/apply-world-club-navigation.mjs
      - name: Validate
        run: npm ci && npm run lint && npm test && npm run build
      - name: Commit UI upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/fm-nav.tsx src/app/football-world-view.tsx src/app/football-world-view.module.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(ui): make world clubs searchable and navigable"
          git pull --rebase origin main
          git push origin HEAD:main
