name: Sprint 4 final state rosters
on:
  push:
    branches:
      - integration/database-roadmap
    paths:
      - "scripts/run-brazil-state-sync-v10.mjs"
      - "scripts/run-brazil-state-sync-v11.mjs"
      - "scripts/refresh-state-roster-quality-sprint4.mjs"
      - ".github/workflows/sprint4-final-state-rosters.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v90-sprint4-state-${{ github.ref }}
  cancel-in-progress: true
jobs:
  populate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/database-roadmap
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve final states and refresh inherited quality
        run: node scripts/run-brazil-state-sync-v11.mjs
      - name: Validate 27-state snapshot
        run: |
          node - <<'NODE'
          import("./src/data/world-2026/state-competitions.generated.ts").then((m) => {
            const expectedIds = {
              ACA1:["69424","10862","10871","32560","32612","60741","87723","137893"],
              APA1:["123477","54247","26494","53471","37491","36532","36012","83882"],
              RRA1:["73575","70707","87822","119625","65748","87824","87823","119510","73574"],
              ROA1:["72476","72477","68823","87821","64303","96876","54241"],
              TOA1:["32639","96025","82329","114114","36477","48003","27242","96026"],
              ALA1:["20092","12600","18545","11449","52513","85388","96022","12914","138869"]
            };
            const qualityTargets = new Set(["SPA1","CEA1","ESA1","RNA1"]);
            const invalidClubNames = new Set(["virtual","placeholder","pendencia","pendencias"]);
            const normalize = (value) => String(value??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
            const rows = new Map(m.BRAZIL_STATE_2026_COMPETITIONS.map((c) => [c.id,c]));
            if (rows.size !== 27) throw new Error(`Expected 27 state championships, found ${rows.size}`);
            for (const [id,ids] of Object.entries(expectedIds)) {
              const c = rows.get(id);
              if (!c) throw new Error(`${id} missing`);
              if (c.clubs.length !== ids.length) throw new Error(`${id} incomplete participants: ${c.clubs.length}/${ids.length}`);
              if (String(c.sourceMode ?? "").includes("preserved")) throw new Error(`${id} must be freshly resolved`);
              if (c.coverage?.players < c.clubs.length * 8) throw new Error(`${id} insufficient roster coverage: ${c.coverage?.players ?? 0}`);
              const actual = c.clubs.map((club) => String(club.transfermarktId ?? ""));
              const identities = new Set(actual);
              if (identities.size !== c.clubs.length) throw new Error(`${id} duplicate club identity`);
              const missing = ids.filter((clubId) => !identities.has(clubId));
              const unexpected = actual.filter((clubId) => !ids.includes(clubId));
              if (missing.length || unexpected.length) throw new Error(`${id} identity mismatch; missing=${missing.join(",")} unexpected=${unexpected.join(",")}`);
              for (const club of c.clubs) {
                if (!club.transfermarktId || !club.imageUrl) throw new Error(`${id}: club without identity/badge`);
                if (invalidClubNames.has(normalize(club.name))) throw new Error(`${id}: invalid club ${club.name}`);
              }
              console.log(`${id}: ${c.clubs.length} clubs / ${c.coverage?.players ?? 0} players / ${c.sourceMode}`);
            }
            const ala = rows.get("ALA1");
            if (!ala.clubs.some((club) => String(club.transfermarktId) === "12914" && club.name === "Murici FC")) throw new Error("ALA1 missing Murici FC identity 12914");
            if (!ala.clubs.some((club) => String(club.transfermarktId) === "138869" && club.name === "Murici Sport Clube")) throw new Error("ALA1 missing Murici Sport Clube identity 138869");
            const toc = rows.get("TOA1");
            if (!toc.clubs.some((club) => String(club.transfermarktId) === "96026" && /União Atlético/i.test(club.name))) throw new Error("TOA1 must expose identity 96026 as União Atlético");
            for (const id of qualityTargets) {
              const c = rows.get(id);
              if (!c || !String(c.sourceMode??"").includes("sprint4-quality-refresh")) throw new Error(`${id} quality refresh not applied`);
              for (const club of c.clubs) {
                const players = club.players ?? [];
                if (players.some((player) => /^(pend[eê]ncias?|pending|unknown|desconhecido|n\/?a|null|undefined|-)?$/i.test(String(player?.name??"").trim()))) throw new Error(`${id}: suspicious player record remains in ${club.name}`);
              }
              console.log(`QUALITY ${id}: ${c.clubs.length} clubs / ${c.coverage?.players ?? 0} players / partial=${(c.coverage?.partialClubs??[]).join(",")}`);
            }
            const capivariano = rows.get("SPA1").clubs.find((club) => /capivariano/i.test(club.name));
            const maranguape = rows.get("CEA1").clubs.find((club) => /maranguape/i.test(club.name));
            if (!capivariano || !rows.get("SPA1").coverage.partialClubs.some((name) => /capivariano/i.test(name))) throw new Error("Capivariano source limitation must remain visible as partial");
            if (!maranguape || !rows.get("CEA1").coverage.partialClubs.some((name) => /maranguape/i.test(name))) throw new Error("Maranguape source limitation must remain visible as partial");
            const vila = rows.get("ESA1").clubs.find((club) => /vilavelhense/i.test(club.name));
            const desportiva = rows.get("ESA1").clubs.find((club) => /desportiva ferroviaria/i.test(club.name.normalize("NFD").replace(/[\u0300-\u036f]/g,"")));
            const globo = rows.get("RNA1").clubs.find((club) => /globo/i.test(club.name));
            if (!vila || (vila.players??[]).length < 8) throw new Error("Vilavelhense roster repair did not reach usable coverage");
            if (!desportiva || (desportiva.players??[]).length < 8) throw new Error("Desportiva roster repair did not reach usable coverage");
            if (!globo || (globo.players??[]).length < 8) throw new Error("Globo roster repair did not reach usable coverage");
            console.log(`State map complete: ${rows.size}/27`);
          }).catch((error) => { console.error(error); process.exit(1); });
          NODE
          npm run build
      - name: Commit validated 27-state snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/world-2026/state-competitions.generated.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(sprint4): complete and clean Brazilian state championships"
          git push origin HEAD:integration/database-roadmap
