name: Fix manager world package
on:
  push:
    branches: [feat/manager-world-media-board-ui]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/manager-world-media-board-ui
      - name: Fix national career narrowing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/game-engine/national-team.ts')
          t=p.read_text()
          old='const team=byId(career.teamId)!'
          if old not in t:
              raise SystemExit('target missing')
          p.write_text(t.replace(old,'const team=byId(state.teamId)!',1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-engine/national-team.ts
          git commit -m "fix: estreitar id da seleção no motor internacional"
          git push origin HEAD:feat/manager-world-media-board-ui
