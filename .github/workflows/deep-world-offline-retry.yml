name: Deep world and offline PWA retry
on:
  push:
    paths:
      - '.github/workflows/deep-world-offline-retry.yml'
permissions:
  contents: write
jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reapply upgrade with lint fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/deep-world-offline.yml').read_text().splitlines()
          blocks=[];i=0
          while i<len(lines):
              if lines[i].startswith('        run: |'):
                  i+=1;block=[]
                  while i<len(lines) and (lines[i].startswith('          ') or not lines[i].strip()):
                      block.append(lines[i][10:] if lines[i].startswith('          ') else '');i+=1
                  blocks.append('\n'.join(block));continue
              i+=1
          script='\n\n'.join(blocks[:3])
          result=subprocess.run(['bash','-euo','pipefail'],input=script,text=True)
          if result.returncode: raise SystemExit(result.returncode)
          market=Path('src/game-engine/market.ts');s=market.read_text();s=s.replace('let deals=0,maxDeals=Math.max','let deals=0;const maxDeals=Math.max');market.write_text(s)
          PY
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit validated upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public next.config.ts
          git rm .github/workflows/deep-world-offline.yml .github/workflows/deep-world-offline-retry.yml
          git commit -m "feat: deepen persistent world and add offline PWA"
          git push
