name: Apply state championship world integration
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/apply-state-world-integration.mjs"
      - ".github/workflows/apply-state-world-integration.yml"
permissions:
  contents: write
concurrency:
  group: v90-state-world-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply integration
        run: node scripts/apply-state-world-integration.mjs
      - name: Validate
        run: npm ci && npm run lint && npm test && npm run build
      - name: Commit UI integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/fm-nav.tsx src/app/football-world-view.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(ui): expose state championships in World and search"
          git pull --rebase origin main
          git push origin HEAD:main
