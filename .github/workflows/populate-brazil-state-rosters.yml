name: Populate Brazilian state rosters
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v90-brazil-state-rosters-${{ github.ref }}
  cancel-in-progress: true
jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch verified state squads
        run: node scripts/fetch-brazil-state-competitions-2026.mjs
      - name: Stamp snapshot date
        run: node scripts/stamp-roster-snapshots.mjs src/data/world-2026/state-competitions.generated.ts
      - name: Validate generated snapshot
        run: |
          SNAPSHOT_DATE=$(TZ=America/Sao_Paulo date +%F)
          test -s src/data/world-2026/state-competitions.generated.ts
          grep -q "$SNAPSHOT_DATE" src/data/world-2026/state-competitions.generated.ts
          grep -q "BRAZIL_STATE_2026_COMPETITIONS" src/data/world-2026/state-competitions.generated.ts
          grep -q "BRAZIL_STATE_2026_SYNC_ERRORS" src/data/world-2026/state-competitions.generated.ts
      - name: Commit state snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/world-2026/state-competitions.generated.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: populate verified Brazilian state championships"
          git pull --rebase origin main
          git push origin HEAD:main
