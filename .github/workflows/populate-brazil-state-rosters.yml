name: Populate Brazilian state rosters
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch-brazil-state-competitions-2026.mjs"
      - ".github/workflows/populate-brazil-state-rosters.yml"
permissions:
  contents: write
jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch verified state squads
        run: node scripts/fetch-brazil-state-competitions-2026.mjs
      - name: Validate generated module
        run: npm ci && npx tsc --noEmit
      - name: Commit state snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/world-2026/state-competitions.generated.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: populate verified Brazilian state championships"
          git push
