name: Apply season integrity follow-up
on:
  workflow_dispatch:
  push:
    branches:
      - fix/season-lifecycle-calendar-duty-states
    paths:
      - "scripts/season-integrity-followup.mjs"
      - ".github/workflows/apply-season-integrity-followup.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply follow-up
        run: node scripts/season-integrity-followup.mjs
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-engine/club-ai.ts src/game-engine/world-competitions.ts src/game-engine/calendar-coordinator.ts src/game-engine/season.ts
          git commit -m "fix(season): repair legacy cups and honor international duty"
          git pull --rebase origin fix/season-lifecycle-calendar-duty-states
          git push origin HEAD:fix/season-lifecycle-calendar-duty-states
