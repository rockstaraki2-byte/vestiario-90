name: Patch validation branch
on:
  push:
    branches: [feat/real-world-calendar-2026]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/real-world-calendar-2026
      - name: Apply narrow TypeScript inference fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/game-engine/world-competitions.ts')
          text=path.read_text()
          old='legs:stage==="Final"?1:2,kind:'
          new='legs:(stage==="Final"?1:2) as 1|2,kind:'
          if old not in text:
              raise SystemExit('target expression not found')
          path.write_text(text.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-engine/world-competitions.ts
          git commit -m "chore: fix competition stage type inference"
          git push origin HEAD:feat/real-world-calendar-2026
