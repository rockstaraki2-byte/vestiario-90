name: Validate real-world calendar branch
on:
  push:
    branches: [feat/real-world-calendar-2026]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/real-world-calendar-2026
      - name: Finalize branch patches
        run: |
          python - <<'PY'
          from pathlib import Path

          world=Path('src/game-engine/world-competitions.ts')
          text=world.read_text()
          old='legs:stage==="Final"?1:2,kind:'
          new='legs:(stage==="Final"?1:2) as 1|2,kind:'
          if old in text:
              world.write_text(text.replace(old,new,1))

          club_ai=Path('src/game-engine/club-ai.ts')
          text=club_ai.read_text()
          old='const style=rng.pick(STYLES),defaults=styleDefaults(style),real=useRealBase&&clubName?realManagerForClub(clubName):undefined;\n  return{clubId,managerName:real?.manager??generatedManagerName(rng),style,formation:'
          new='const style=rng.pick(STYLES),defaults=styleDefaults(style),real=useRealBase&&clubName?realManagerForClub(clubName):undefined,fallbackName=generatedManagerName(rng);\n  return{clubId,managerName:real?.manager??fallbackName,style,formation:'
          if old in text:
              club_ai.write_text(text.replace(old,new,1))
          elif 'fallbackName=generatedManagerName(rng)' not in text:
              raise SystemExit('club ai deterministic target not found')

          page=Path('src/app/page.tsx')
          text=page.read_text()
          old_nav='<nav className={styles.mobileNav} style={{overflowX:"auto",justifyContent:"flex-start",scrollbarWidth:"none"}}>{NAV.map(([label,Icon])=><button key={label} style={{minWidth:68,flex:"0 0 68px"}} onClick={()=>{setActive(label);setMatch(null)}} className={active===label?styles.mobileActive:""}><Icon size={20}/><span>{label==="Central de Dados"?"Dados":label==="Gestão & Legado"?"Gestão":label.split(" ")[0]}</span></button>)}</nav>'
          new_nav='<nav className={styles.mobileNav}>{NAV.slice(0,5).map(([label,Icon])=><button key={label} onClick={()=>{setActive(label);setMatch(null)}} className={active===label?styles.mobileActive:""}><Icon size={20}/><span>{label.split(" ")[0]}</span></button>)}</nav>'
          if old_nav in text:
              page.write_text(text.replace(old_nav,new_nav,1))
          elif new_nav not in text:
              raise SystemExit('mobile nav target not found')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx src/game-engine/world-competitions.ts src/game-engine/club-ai.ts
          git commit -m "chore: finalize calendar validation"
          git push origin HEAD:feat/real-world-calendar-2026
