name: World depth fix
on:
  push:
    branches: [v90-world-depth]
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fix immediate manager rehiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/game-engine/club-ai.ts')
          s=p.read_text(encoding='utf-8')
          old='function candidateCareer(state:ClubAiState,club:LeagueClub,rng:SeededRng){const free=state.careers.filter(c=>c.available&&Math.abs(c.reputation-club.reputation)<=20).sort((a,b)=>b.reputation-a.reputation);'
          new='function candidateCareer(state:ClubAiState,club:LeagueClub,rng:SeededRng,excludedManager?:string){const free=state.careers.filter(c=>c.available&&c.managerName!==excludedManager&&Math.abs(c.reputation-club.reputation)<=20).sort((a,b)=>b.reputation-a.reputation);'
          if old not in s: raise SystemExit('candidateCareer pattern missing')
          s=s.replace(old,new,1).replace('const returning=candidateCareer(next,club,rng),replacement=', 'const returning=candidateCareer(next,club,rng,oldManager),replacement=',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate full game
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit validated branch
        run: |
          rm -f validation-world-depth.log .github/workflows/world-depth-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: deepen football world and manager simulation'
          git push
