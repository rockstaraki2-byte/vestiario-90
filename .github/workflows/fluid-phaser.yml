name: Fluid Phaser
on:
  push:
    branches: [main]
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python scripts/apply-fluid-phaser.py
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat: smooth Phaser motion and add slow match speed"
          git push
      - name: Cleanup rollout tooling
        run: |
          git rm scripts/apply-fluid-phaser.py .github/workflows/fluid-phaser.yml
          git commit -m "chore: remove fluid Phaser rollout tooling"
          git push
