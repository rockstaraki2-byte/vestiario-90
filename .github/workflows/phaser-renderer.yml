name: Phaser Renderer
on:
  push:
    branches: [main]
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python scripts/apply-phaser-renderer.py
      - run: python scripts/apply-phaser-renderer-fix.py
      - run: npm install phaser@4.2.1 --save
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src
          git commit -m "feat: migrate 2D renderer to Phaser 4"
          git push
      - name: Cleanup rollout tooling
        run: |
          git rm scripts/apply-phaser-renderer.py scripts/apply-phaser-renderer-fix.py .github/workflows/phaser-renderer.yml
          git commit -m "chore: remove Phaser rollout tooling"
          git push
