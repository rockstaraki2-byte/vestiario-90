name: Apply season integrity fix
on:
  workflow_dispatch:
  push:
    branches:
      - fix/season-lifecycle-calendar-duty-states
    paths:
      - "scripts/apply-season-integrity-fix.mjs"
      - "scripts/apply-season-integrity-fix-v2.mjs"
      - ".github/workflows/apply-season-integrity-fix.yml"
permissions:
  contents: write
concurrency:
  group: v90-season-integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply structural fixes
        run: node scripts/apply-season-integrity-fix-v2.mjs
      - name: Validate
        run: npm ci && npm run lint && npm test && npm run build
      - name: Commit generated source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-engine/world-competitions.ts src/game-engine/club-ai.ts src/game-engine/calendar-coordinator.ts src/game-engine/season.ts src/app/page-v5.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(season): close seasons and preserve full competition calendar"
          git pull --rebase origin fix/season-lifecycle-calendar-duty-states
          git push origin HEAD:fix/season-lifecycle-calendar-duty-states
