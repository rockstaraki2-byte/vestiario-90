name: Apply Sprint 11 Integration
on:
  push:
    branches: [feat/sprint11-club-management]
    paths:
      - scripts/apply-sprint11-integration.mjs
      - .github/workflows/apply-sprint11.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sprint11-club-management
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-sprint11-integration.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit integrated Sprint 11
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-sprint11-integration.mjs .github/workflows/apply-sprint11.yml
          git add src/game-engine/club-management.ts src/game-engine/season.ts src/app/club-management-view.tsx src/app/page.tsx docs/BACKLOG.md
          git commit -m "feat: connect Sprint 11 club management"
          git push origin HEAD:feat/sprint11-club-management
