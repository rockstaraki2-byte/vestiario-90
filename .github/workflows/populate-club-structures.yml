name: Populate verified club structures
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch-club-structures-2026.mjs"
      - ".github/workflows/populate-club-structures.yml"
permissions:
  contents: write
jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch real club structure fields
        run: node scripts/fetch-club-structures-2026.mjs
      - name: Validate generated module
        run: npm ci && npx tsc --noEmit
      - name: Commit structure snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/world-2026/club-structures.generated.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: populate verified club staff structures"
          git push
