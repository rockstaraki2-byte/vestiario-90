name: Add header schedule
on:
  push:
    paths:
      - '.github/workflows/add-header-schedule.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch header schedule
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('src/app/page.tsx')
          text = page.read_text()

          old_import = 'import { workloadAdvice } from "@/game-engine/workload";\n'
          new_import = old_import + 'import { userWorldCompetitionMatches } from "@/game-engine/world-competitions";\n'
          if 'userWorldCompetitionMatches' not in text:
              text = text.replace(old_import, new_import)

          nav = 'const NAV=[["Visão geral",Home],["Caixa de entrada",Inbox],["Elenco",Users],["Vestiário",MessageSquareText],["Clube",Building2],["Táticas",LayoutGrid],["Calendário",CalendarDays],["Classificação",Trophy],["Central de Dados",BarChart3],["Mídia & Redes",Megaphone],["Seleção",Flag],["Mundo",Globe2],["Gestão & Legado",Landmark],["Mercado",BarChart3],["Carreira",BriefcaseBusiness],["Notícias",Newspaper],["Configurações",Settings]] as const;\n'
          helper = nav + '\nfunction daysBetweenIso(from:string,to:string){const a=new Date(`${from}T12:00:00Z`).getTime(),b=new Date(`${to}T12:00:00Z`).getTime();return Math.max(0,Math.round((b-a)/86400000))}\n'
          if 'function daysBetweenIso' not in text:
              text = text.replace(nav, helper)

          anchor = '  const preMatchMedia=pendingMedia.find(session=>session.format==="Coletiva pré-jogo"),postMatchMedia=pendingMedia.find(session=>session.format==="Coletiva pós-jogo"),todayMatch=Boolean(todayFixture||todayCup),selectionReady=matchdaySelectionReadyForMatch(season,todayCup?.match.id),attention=pendingEvents[0];\n'
          schedule = anchor + '''  const nextClubCommitment=(()=>{const leagueItems=getUserFixtures(season).filter(f=>!f.played&&Boolean(f.date)&&f.date!>=season.currentDate).map(f=>{const opponentId=f.homeClubId===club.id?f.awayClubId:f.homeClubId;return{date:f.date!,opponent:league.clubs.find(c=>c.id===opponentId)?.name??"Adversário",competition:competition.shortName??competition.name,stage:`Rodada ${f.round}`}}),cupItems=userWorldCompetitionMatches(season.worldCompetitions,club.id).filter(({match})=>!match.played&&match.date>=season.currentDate).map(({tournament,match})=>({date:match.date,opponent:match.home.activeClubId===club.id?match.away.name:match.home.name,competition:tournament.definition.shortName,stage:match.stage}));return[...leagueItems,...cupItems].sort((a,b)=>a.date.localeCompare(b.date))[0]})();\n  const daysToNextCommitment=nextClubCommitment?daysBetweenIso(season.currentDate,nextClubCommitment.date):undefined;\n'''
          if 'const nextClubCommitment=' not in text:
              text = text.replace(anchor, schedule)

          old_header = '<header className={styles.topbar}><div className={styles.mobileBrand}>V90</div><div className={styles.season}><span>{employed?competition.name:"Mercado de Treinadores"} • Temporada {season.year}</span><b>{season.completed?"TEMPORADA ENCERRADA":`RODADA ${season.currentRound} DE ${totalRounds}`} • {formatDate(season.currentDate)}</b></div><div className={styles.topActions}>'
          new_header = '<header className={styles.topbar}><div className={styles.mobileBrand}>V90</div><div className={styles.season}><span>{employed?competition.name:"Mercado de Treinadores"} • Temporada {season.year}</span><b>{season.completed?"TEMPORADA ENCERRADA":`RODADA ${season.currentRound} DE ${totalRounds}`} • {formatDate(season.currentDate)}</b></div><div className={styles.headerSchedule}><div><CalendarDays size={16}/><span><small>DATA DO SAVE</small><b>{formatDate(season.currentDate)}</b></span></div><div className={styles.nextCommitment}><Trophy size={16}/><span><small>PRÓXIMO COMPROMISSO</small><b>{nextClubCommitment?`${nextClubCommitment.opponent} • ${nextClubCommitment.competition}`:"Sem jogo agendado"}</b><em>{nextClubCommitment?(daysToNextCommitment===0?"HOJE":daysToNextCommitment===1?"AMANHÃ":`EM ${daysToNextCommitment} DIAS`):"—"}</em></span></div></div><div className={styles.topActions}>'
          if old_header not in text:
              raise SystemExit('header anchor not found')
          text = text.replace(old_header, new_header)
          page.write_text(text)

          css = Path('src/app/page.module.css')
          styles = css.read_text()
          marker = '.mobileBrand{display:none}'
          addition = '.headerSchedule{display:flex;align-items:center;gap:18px;margin-left:auto;margin-right:18px}.headerSchedule>div{display:flex;align-items:center;gap:8px;min-width:0}.headerSchedule svg{color:#8ba59e;flex-shrink:0}.headerSchedule span{display:grid;grid-template-columns:auto auto;column-gap:8px;align-items:center;min-width:0}.headerSchedule small{grid-column:1/-1;color:#607d75;font-size:8px;letter-spacing:.8px;font-weight:800}.headerSchedule b{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.headerSchedule em{font-style:normal;color:#d9ff43;background:#1c2b16;border:1px solid #506a22;border-radius:10px;padding:2px 6px;font-size:8px;font-weight:900;white-space:nowrap}.nextCommitment{max-width:360px}.mobileBrand{display:none}'
          if '.headerSchedule{' not in styles:
              styles = styles.replace(marker, addition)
          styles = styles.replace('@media(max-width:1050px){.kpis', '@media(max-width:1050px){.headerSchedule{gap:10px;margin-right:10px}.headerSchedule>div:first-child{display:none}.nextCommitment{max-width:280px}.kpis')
          styles = styles.replace('@media(max-width:720px){.sidebar{display:none}.main{margin-left:0}.topbar{height:62px;padding:0 14px}.mobileBrand{display:grid}.season{display:none}', '@media(max-width:720px){.sidebar{display:none}.main{margin-left:0}.topbar{height:62px;padding:0 14px;gap:10px}.mobileBrand{display:grid;flex-shrink:0}.season{display:none}.headerSchedule{display:flex;flex:1;margin:0;min-width:0}.headerSchedule>div:first-child{display:none}.nextCommitment{display:flex!important;max-width:none;min-width:0}.headerSchedule span{display:grid;grid-template-columns:minmax(0,1fr) auto;width:100%}.headerSchedule small{font-size:7px}.headerSchedule b{font-size:9px}.headerSchedule em{font-size:7px}.nextCommitment svg{display:none}')
          styles = styles.replace('@media(max-width:430px){.kpis', '@media(max-width:430px){.headerSchedule b{max-width:145px}.headerSchedule em{padding:2px 4px}.kpis')
          css.write_text(styles)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          rm .github/workflows/add-header-schedule.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/page.tsx src/app/page.module.css .github/workflows/add-header-schedule.yml
          git commit -m 'feat(header): show save date and next commitment'
          git push
