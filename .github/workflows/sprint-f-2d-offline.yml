name: Sprint F 2D Offline
on:
  push:
    branches: [main]
    paths:
      - scripts/sprint-f-fix.py
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python scripts/sprint-f-fix.py
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public
          git commit -m "feat: sprint F long-term world 2D match and offline saves"
          git push
      - name: Remove rollout tooling
        run: |
          git rm scripts/apply-sprint-f-2d-offline.py scripts/sprint-f-trigger.txt scripts/sprint-f-fix.py .github/workflows/sprint-f-2d-offline.yml
          git commit -m "chore: remove sprint F rollout tooling"
          git push
