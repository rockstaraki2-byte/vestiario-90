name: Sync Brasileirao Serie A rosters
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v90-brazil-serie-a-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch current Serie A squads
        run: node scripts/fetch-transfermarkt-snapshot.mjs
      - name: Stamp snapshot date
        run: node scripts/stamp-roster-snapshots.mjs src/data/brasileirao-2026/transfermarkt-snapshot.ts
      - name: Validate snapshot
        run: |
          SNAPSHOT_DATE=$(TZ=America/Sao_Paulo date +%F)
          test -s src/data/brasileirao-2026/transfermarkt-snapshot.ts
          grep -q "$SNAPSHOT_DATE" src/data/brasileirao-2026/transfermarkt-snapshot.ts
          grep -q 'clubs:20' src/data/brasileirao-2026/transfermarkt-snapshot.ts
      - name: Commit roster snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/brasileirao-2026/transfermarkt-snapshot.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh Brasileirao Serie A squads"
          git pull --rebase origin main
          git push origin HEAD:main
