name: Apply Sprint 5 UI
on:
  push:
    branches: [feat/sprint5-world-market-values]
    paths:
      - scripts/apply-sprint5-ui.mjs
      - .github/workflows/apply-sprint5-ui.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sprint5-world-market-values
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-sprint5-ui.mjs
      - name: Commit dashboard integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: connect Sprint 5 world to dashboard"
          git push origin HEAD:feat/sprint5-world-market-values
