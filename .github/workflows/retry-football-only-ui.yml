name: Retry football-only flow and UI
on:
  push:
    branches: [feat/football-only-flow-ui]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/football-only-flow-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Reapply package with typed migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow=Path('.github/workflows/apply-football-only-ui.yml').read_text()
          marker="          python - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY",start)
          script=textwrap.dedent(workflow[start:end])
          old="t=t.replace('lifeEvents:current.lifeEvents??[]','lifeEvents:[]',1)"
          new="t=t.replace('lifeEvents:current.lifeEvents??[]','lifeEvents:[] as PlayerLifeEvent[]',1)"
          if old not in script: raise SystemExit('typed lifeEvents patch target missing')
          script=script.replace(old,new,1)
          exec(compile(script,'football-only-generator','exec'),{})
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit validated package
        run: |
          rm .github/workflows/apply-football-only-ui.yml .github/workflows/retry-football-only-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: remover ruído fora de campo e renovar UX"
          git push origin HEAD:feat/football-only-flow-ui
