name: Sync international participants
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch-international-participants-2026.mjs"
      - ".github/workflows/sync-international-participants.yml"
permissions:
  contents: write
concurrency:
  group: v90-data-snapshot-main
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-international-participants-2026.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/world-2026/international-participants.generated.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: sync 2026 international competition participants"
          git pull --rebase origin main
          git push origin HEAD:main
