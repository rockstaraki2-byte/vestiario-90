name: Sync international participants
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v90-international-snapshot-main
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch participants and real squads
        run: node scripts/fetch-international-participants-2026.mjs
      - name: Validate generated snapshot
        run: npm ci && npm run test -- --run
      - name: Commit international snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/world-2026/international-participants.generated.ts src/data/world-2026/international-rosters.generated.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: sync 2026 international participants and squads"
          git pull --rebase origin main
          git push origin HEAD:main
