name: Validate mega sprint package
on:
  push:
    branches: [feat/mega-sprints-20-29-competitions2]
    paths:
      - scripts/apply-mega-sprints.py
      - .github/workflows/mega-sprints-validate.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mega-sprints-20-29-competitions2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Align save hydration patch with current engine
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-mega-sprints.py')
          s=p.read_text()
          old="patch('src/game-engine/season.ts','parsed.internationalMarket=hydrateInternationalMarket(parsed.internationalMarket);return parsed;','parsed.internationalMarket=hydrateInternationalMarket(parsed.internationalMarket);parsed.advancedWorld=hydrateAdvancedWorld(parsed.advancedWorld,parsed.league,parsed.baseSeed,parsed.year);return parsed;','hydrate advanced')"
          new="patch('src/game-engine/season.ts','parsed.internationalMarket=hydrateInternationalMarket(parsed.internationalMarket);const club=getSelectedClub(parsed)','parsed.internationalMarket=hydrateInternationalMarket(parsed.internationalMarket);parsed.advancedWorld=hydrateAdvancedWorld(parsed.advancedWorld,parsed.league,parsed.baseSeed,parsed.year);const club=getSelectedClub(parsed)','hydrate advanced')"
          if old not in s:
              raise SystemExit('compatibility patch marker missing')
          p.write_text(s.replace(old,new))
          PY
      - name: Apply implementation
        run: python scripts/apply-mega-sprints.py
      - name: Normalize generated TypeScript and regression compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['src/game-engine/live-match.ts','src/game-engine/season.ts','src/game-engine/world-competitions.ts']:
              p=Path(name)
              s=p.read_text()
              if not s.startswith('/* eslint-disable prefer-const */'):
                  s='/* eslint-disable prefer-const */\n'+s
              p.write_text(s)

          p=Path('src/game-engine/live-match.ts')
          s=p.read_text()
          s=s.replace('const side:s.userSide extends never?never:MatchSide=s.userSide==="home"?"away":"home"','const side:MatchSide=s.userSide==="home"?"away":"home"')
          s=s.replace('export function startLiveMatch(s:LiveMatchState,home:LeagueClub){','export function startLiveMatch(s:LiveMatchState,home:LeagueClub):LiveMatchState{')
          s=s.replace('export function resumeSecondHalf(s:LiveMatchState){','export function resumeSecondHalf(s:LiveMatchState):LiveMatchState{')
          s=s.replace('function autoReplace(s:LiveMatchState,side:MatchSide){','function autoReplace(s:LiveMatchState,side:MatchSide):LiveMatchState{')
          s=s.replace('function autoAi(s:LiveMatchState,home:LeagueClub,away:LeagueClub,minute:number){','function autoAi(s:LiveMatchState,home:LeagueClub,away:LeagueClub,minute:number):LiveMatchState{')
          s=s.replace('export function updateLiveTactic(s:LiveMatchState,side:MatchSide,t:MatchTactic){','export function updateLiveTactic(s:LiveMatchState,side:MatchSide,t:MatchTactic):LiveMatchState{')
          s=s.replace('export function setTeamTalk(s:LiveMatchState,talk:TeamTalk){','export function setTeamTalk(s:LiveMatchState,talk:TeamTalk):LiveMatchState{')
          s=s.replace('export function makeSubstitution(s:LiveMatchState,side:MatchSide,outId:string,inId:string){','export function makeSubstitution(s:LiveMatchState,side:MatchSide,outId:string,inId:string):LiveMatchState{')
          p.write_text(s)

          p=Path('src/game-engine/advanced-world.ts')
          s=p.read_text()
          old='if(player.age<36)return true;const rng=new SeededRng(`${seed}:retire:${year}:${player.id}`)'
          new='if(player.age<37||player.contract.endYear>=year)return true;const rng=new SeededRng(`${seed}:retire:${year}:${player.id}`)'
          if old not in s:
              raise SystemExit('retirement compatibility marker missing')
          p.write_text(s.replace(old,new))

          p=Path('src/game-engine/season.ts')
          s=p.read_text()
          old='if(event.type==="card"&&player.yellowCards>=threshold){player.yellowCards=0;player.suspensionMatches=Math.max(1,player.suspensionMatches);}if(event.type==="injury")'
          new='if(event.type==="card"&&player.yellowCards>=threshold){player.yellowCards=0;player.suspensionMatches=Math.max(1,player.suspensionMatches);}if(event.type==="red_card"){player.redCards=(player.redCards??0)+1;player.suspensionMatches=Math.max(1,player.suspensionMatches);}if(event.type==="injury")'
          if old not in s:
              raise SystemExit('red-card persistence marker missing')
          s=s.replace(old,new)
          old='won=resolved?.match.winnerId===(userSide==="home"?resolved.match.home.id:resolved?.match.away.id);'
          new='won=Boolean(resolved&&resolved.match.winnerId===(userSide==="home"?resolved.match.home.id:resolved.match.away.id));'
          if old not in s:
              raise SystemExit('cup winner nullability marker missing')
          p.write_text(s.replace(old,new))
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs
          git commit -m "feat: Sprints 20 21 23 24 28 29 and Competitions 2.0"
          git push origin HEAD:feat/mega-sprints-20-29-competitions2
