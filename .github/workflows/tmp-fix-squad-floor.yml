name: Temporary minimum squad floor patch

on:
  push:
    branches:
      - feat/sprint1-long-term-stability-v2
    paths:
      - ".github/workflows/tmp-fix-squad-floor.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sprint1-long-term-stability-v2
      - name: Guarantee minimum squad after retirements
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/game-engine/advanced-world.ts')
          s=p.read_text()
          old='const lost=before-club.players.length,target=Math.max(22,before);for(let i=0;club.players.length<target&&i<Math.max(2,lost+2);i++)club.players.push(newgen(club,i+1,year,seed));'
          new='const target=Math.max(22,before);for(let i=0;club.players.length<target;i++)club.players.push(newgen(club,i+1,year,seed));'
          if old not in s:
              raise SystemExit('target retirement/newgen loop not found')
          p.write_text(s.replace(old,new))
          PY
          git rm .github/workflows/tmp-fix-squad-floor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-engine/advanced-world.ts
          git commit -m "fix(stability): guarantee minimum squad after retirements"
          git push origin HEAD:feat/sprint1-long-term-stability-v2
