name: Director market media upgrade
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply delegation upgrade
        run: |
          sed -i 's/;let message=!accept?/;const message=!accept?/' .github/scripts/director-market-media-patch.py
          python .github/scripts/director-market-media-patch.py
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit validated upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/director-market-media-delegation.yml
          rm .github/scripts/director-market-media-patch.py
          git add -A
          git commit -m "feat: delegate market decisions and press conferences"
          git push
