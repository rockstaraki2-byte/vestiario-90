name: Director market media upgrade
'on':
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  upgrade:
    if: ${{ github.event.head_commit.message == 'fix: run director market media upgrade' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply delegation upgrade
        run: python .github/scripts/director-market-media-patch.py
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit validated upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/director-market-media-delegation.yml
          rm .github/scripts/director-market-media-patch.py
          git add -A
          git commit -m "feat: delegate market decisions and press conferences"
          git push
