      - name: Patch engines and views
        run: |
          python - <<'PY'
          from pathlib import Path

          # league fixture metadata
          p=Path('src/game-engine/league.ts');s=p.read_text()
          old='export type LeagueFixture={id:string;round:number;homeClubId:string;awayClubId:string;played:boolean;date?:string;homeGoals?:number;awayGoals?:number;homeShots?:number;awayShots?:number;possessionHome?:number;homeYellowCards?:number;awayYellowCards?:number};'
          new='export type LeagueFixture={id:string;round:number;homeClubId:string;awayClubId:string;played:boolean;date?:string;originalDate?:string;rescheduledReason?:string;homeGoals?:number;awayGoals?:number;homeShots?:number;awayShots?:number;possessionHome?:number;homeYellowCards?:number;awayYellowCards?:number};'
          if old not in s: raise SystemExit('LeagueFixture anchor missing')
          p.write_text(s.replace(old,new,1))

          # world competition dates + metadata + real Libertadores thirds in Sudamericana
          p=Path('src/game-engine/world-competitions.ts');s=p.read_text()
          old='export type WorldCompetitionMatch={id:string;competitionId:WorldCompetitionId;stage:string;roundDue:number;date:string;home:WorldParticipant;away:WorldParticipant;played:boolean;homeGoals?:number;awayGoals?:number;winnerId?:string;decidedByPenalties?:boolean;leg?:1|2;tieId?:string;group?:string;matchday?:number;tableStage?:boolean};'
          new='export type WorldCompetitionMatch={id:string;competitionId:WorldCompetitionId;stage:string;roundDue:number;date:string;originalDate?:string;rescheduledReason?:string;home:WorldParticipant;away:WorldParticipant;played:boolean;homeGoals?:number;awayGoals?:number;winnerId?:string;decidedByPenalties?:boolean;leg?:1|2;tieId?:string;group?:string;matchday?:number;tableStage?:boolean};'
          if old not in s: raise SystemExit('WorldCompetitionMatch anchor missing')
          s=s.replace(old,new,1)
          for a,b in {
            '["2026-08-12","2026-08-19"]':'["2026-08-11","2026-08-18"]',
            '["2026-09-09","2026-09-16"]':'["2026-09-08","2026-09-15"]',
            '["2026-10-14","2026-10-21"]':'["2026-10-13","2026-10-20"]',
            '["2026-07-22","2026-07-29"]':'["2026-07-21","2026-07-28"]',
            'H:["UCV FC","Libertad","Rosario Central","Independiente del Valle"]':'H:["Universidad Central","Libertad","Rosario Central","Independiente del Valle"]'
          }.items(): s=s.replace(a,b)
          anchor='function groupQualifiers(t:WorldTournamentState,matches:WorldCompetitionMatch[],take:number){const result:WorldParticipant[]=[];for(const group of [...new Set(matches.map(m=>m.group).filter(Boolean))] as string[]){const gm=matches.filter(m=>m.group===group),ids=new Set(gm.flatMap(m=>[m.home.id,m.away.id])),participants=t.participants.filter(p=>ids.has(p.id));result.push(...table(gm,participants).slice(0,take).map(r=>r.p));}return result;}\n'
          addition='function libertadoresThirdPlaces(state:WorldCompetitionsState){const lib=state.tournaments.find(item=>item.definition.id==="LIB");if(!lib)return[];const matches=lib.matches.filter(match=>match.group&&match.stage==="Fase de grupos"),result:WorldParticipant[]=[];for(const group of [...new Set(matches.map(match=>match.group!).filter(Boolean))]){const gm=matches.filter(match=>match.group===group),ids=new Set(gm.flatMap(match=>[match.home.id,match.away.id])),participants=lib.participants.filter(participant=>ids.has(participant.id)),third=table(gm,participants)[2]?.p;if(third)result.push(third);}return result;}\n'
          if anchor not in s: raise SystemExit('groupQualifiers anchor missing')
          s=s.replace(anchor,anchor+addition,1)
          old='t.directQualifierIds=leaders.map(p=>p.id);nextParticipants=[...runners,...Array.from({length:8},(_,i)=>virtual(`3º Libertadores Grupo ${String.fromCharCode(65+i)}`,"CONMEBOL",`lib3-${i}`))];'
          new='t.directQualifierIds=leaders.map(p=>p.id);const libThirds=libertadoresThirdPlaces(state),thirds=libThirds.length===8?libThirds:Array.from({length:8},(_,i)=>virtual(`3º Libertadores Grupo ${String.fromCharCode(65+i)}`,"CONMEBOL",`lib3-${i}`));nextParticipants=[...runners,...thirds];'
          if old not in s: raise SystemExit('Sudamericana third-place anchor missing')
          p.write_text(s.replace(old,new,1))

          # season calendar coordinator integration
          p=Path('src/game-engine/season.ts');s=p.read_text()
          anchor='import { createActiveBoard, hydrateActiveBoard, processActiveBoardAfterRound, type ActiveBoardState } from "./active-board";\n'
          addition='import { coordinateSeasonCalendars } from "./calendar-coordinator";\n'
          if addition not in s:s=s.replace(anchor,anchor+addition,1)
          old='return{baseSeed,year,league,currentRound:1,selectedClubId:club.id,lineupIds,benchIds,recentForm:[],completed:false,livingWorld:createLivingWorld(club.name,competitionId),mediaWorld:createMediaWorld(competitionId),market:createMarketState(),career:createManagerCareer(club,year),clubManagement:createClubManagementState(league,baseSeed,year),clubAi:createClubAiState(league,baseSeed),worldCompetitions:createWorldCompetitions(competitionId,league,year,baseSeed),internationalMarket:createInternationalMarket(),advancedWorld:createAdvancedWorld(league,baseSeed,year),nationalCareer:createNationalCareer(league,baseSeed,year,55,1),competitionId,currentDate:addIsoDays(firstDate,-7),trainingPlan:DEFAULT_TRAINING_PLAN,worldLeagues:createWorldLeagues(baseSeed,year,competitionId),boardState:createActiveBoard(club,league,year)};'
          new='return coordinateSeasonCalendars({baseSeed,year,league,currentRound:1,selectedClubId:club.id,lineupIds,benchIds,recentForm:[],completed:false,livingWorld:createLivingWorld(club.name,competitionId),mediaWorld:createMediaWorld(competitionId),market:createMarketState(),career:createManagerCareer(club,year),clubManagement:createClubManagementState(league,baseSeed,year),clubAi:createClubAiState(league,baseSeed),worldCompetitions:createWorldCompetitions(competitionId,league,year,baseSeed),internationalMarket:createInternationalMarket(),advancedWorld:createAdvancedWorld(league,baseSeed,year),nationalCareer:createNationalCareer(league,baseSeed,year,55,1),competitionId,currentDate:addIsoDays(firstDate,-7),trainingPlan:DEFAULT_TRAINING_PLAN,worldLeagues:createWorldLeagues(baseSeed,year,competitionId),boardState:createActiveBoard(club,league,year)});'
          if old not in s: raise SystemExit('createSeason return anchor missing')
          s=s.replace(old,new,1)
          old='const processed=processInternationalMarketRound(processMarketRound(processClubManagementRound(nextState)));return processActiveBoardAfterRound(processed);'
          new='const processed=processInternationalMarketRound(processMarketRound(processClubManagementRound(nextState)));return coordinateSeasonCalendars(processActiveBoardAfterRound(processed));'
          if old not in s: raise SystemExit('playCurrentRound return anchor missing')
          s=s.replace(old,new,1)
          old='return processMarketRound({...state,league,lineupIds:selection.lineupIds,benchIds:selection.benchIds,livingWorld,mediaWorld,advancedWorld,worldLeagues});'
          new='return coordinateSeasonCalendars(processMarketRound({...state,league,lineupIds:selection.lineupIds,benchIds:selection.benchIds,livingWorld,mediaWorld,advancedWorld,worldLeagues}));'
          if old not in s: raise SystemExit('advanceSeasonDay return anchor missing')
          s=s.replace(old,new,1)
          old='return processMarketRound(processClubManagementRound({...state,league,lineupIds:selection.lineupIds,benchIds:selection.benchIds,livingWorld,mediaWorld,worldCompetitions,advancedWorld,lastUserMatch:{fixtureId:matchId,homeClubId:context.home.id,awayClubId:context.away.id,result}}));'
          new='return coordinateSeasonCalendars(processMarketRound(processClubManagementRound({...state,league,lineupIds:selection.lineupIds,benchIds:selection.benchIds,livingWorld,mediaWorld,worldCompetitions,advancedWorld,lastUserMatch:{fixtureId:matchId,homeClubId:context.home.id,awayClubId:context.away.id,result}})));'
          if old not in s: raise SystemExit('cup return anchor missing')
          s=s.replace(old,new,1)
          old='return{...state,year:nextYear,league:prepared.league,currentRound:1,lineupIds,benchIds,recentForm:[],completed:false,championClubId:undefined,lastUserMatch:undefined,livingWorld,mediaWorld,market:prepared.market,career:state.career??createManagerCareer(club,nextYear),clubManagement,clubAi,worldCompetitions,internationalMarket,advancedWorld,nationalCareer:hydrateNationalCareer(state.nationalCareer,prepared.league,state.baseSeed,nextYear,livingWorld.managerReputation,1),competitionId,currentDate:addIsoDays(firstDate,-7),worldLeagues:createWorldLeagues(state.baseSeed,nextYear,competitionId),boardState:createActiveBoard(club,prepared.league,nextYear)};'
          new='return coordinateSeasonCalendars({...state,year:nextYear,league:prepared.league,currentRound:1,lineupIds,benchIds,recentForm:[],completed:false,championClubId:undefined,lastUserMatch:undefined,livingWorld,mediaWorld,market:prepared.market,career:state.career??createManagerCareer(club,nextYear),clubManagement,clubAi,worldCompetitions,internationalMarket,advancedWorld,nationalCareer:hydrateNationalCareer(state.nationalCareer,prepared.league,state.baseSeed,nextYear,livingWorld.managerReputation,1),competitionId,currentDate:addIsoDays(firstDate,-7),worldLeagues:createWorldLeagues(state.baseSeed,nextYear,competitionId),boardState:createActiveBoard(club,prepared.league,nextYear)});'
          if old not in s: raise SystemExit('startNextSeason return anchor missing')
          s=s.replace(old,new,1)
          old='parsed.boardState=hydrateActiveBoard(parsed.boardState,parsed);return parsed;'
          new='parsed.boardState=hydrateActiveBoard(parsed.boardState,parsed);return coordinateSeasonCalendars(parsed);'
          if old not in s: raise SystemExit('hydrate return anchor missing')
          p.write_text(s.replace(old,new,1))

          # football world UI
          p=Path('src/app/football-world-view.tsx');s=p.read_text()
          anchor='import { parallelLeagueById, parallelTopPlayers, sortedParallelStandings } from "@/game-engine/world-leagues";\n'
          addition='import { qualificationForPosition, qualificationSummary } from "@/game-engine/competition-rules";\nimport InternationalCompetitionBrowser from "./international-competition-browser";\n'
          if addition not in s:s=s.replace(anchor,anchor+addition,1)
          old='{leagueView==="Tabela"&&<div className={styles.worldTable}><header><span>#</span><span>CLUBE</span><span>J</span><span>V</span><span>E</span><span>D</span><span>SG</span><span>PTS</span></header>{leagueStandings.map((row,index)=><article key={row.clubId}><strong>{index+1}</strong><div><b>{teamName(row.clubId)}</b></div><span>{row.played}</span><span>{row.won}</span><span>{row.drawn}</span><span>{row.lost}</span><span>{row.goalsFor-row.goalsAgainst}</span><b>{row.points}</b></article>)}</div>}'
          new='{leagueView==="Tabela"&&<><p className={styles.qualificationNote}>{qualificationSummary(leagueId)}</p><div className={styles.worldTable}><header><span>#</span><span>CLUBE</span><span>J</span><span>V</span><span>E</span><span>D</span><span>SG</span><span>PTS</span></header>{leagueStandings.map((row,index)=>{const zone=qualificationForPosition(leagueId,index+1,leagueStandings.length);return <article key={row.clubId}><strong>{index+1}</strong><div><b>{teamName(row.clubId)}</b>{zone&&<small className={styles.zone} data-tone={zone.tone}>{zone.label}</small>}</div><span>{row.played}</span><span>{row.won}</span><span>{row.drawn}</span><span>{row.lost}</span><span>{row.goalsFor-row.goalsAgainst}</span><b>{row.points}</b></article>})}</div></>}'
          if old not in s: raise SystemExit('national table UI anchor missing')
          s=s.replace(old,new,1)
          old='<div><span>{f.date}</span><small>Rodada {f.round}</small></div><b>{teamName(f.homeClubId)}</b>'
          new='<div><span>{f.date}</span><small>Rodada {f.round}</small>{f.originalDate&&<em>remarcado de {f.originalDate}</em>}</div><b>{teamName(f.homeClubId)}</b>'
          s=s.replace(old,new)
          old='  {tab==="Competições"&&<div className={styles.grid}>\n'
          new='  {tab==="Competições"&&<><InternationalCompetitionBrowser state={world}/><div className={styles.grid}>\n'
          if old not in s: raise SystemExit('competitions open anchor missing')
          s=s.replace(old,new,1)
          marker='  {tab==="Seleções"&&<div className={styles.grid}>'
          idx=s.find(marker)
          if idx<0: raise SystemExit('selections marker missing')
          before=s[:idx]
          last=before.rfind('  </div>}\n')
          if last<0: raise SystemExit('competitions close anchor missing')
          before=before[:last]+'  </div></>}\n'+before[last+len('  </div>}\n'):]
          p.write_text(before+s[idx:])

          p=Path('src/app/football-world-view.module.css');s=p.read_text()
          addition='''.qualificationNote{font-size:9px;line-height:1.45;color:#758078;background:#f5f8f6;border-radius:9px;padding:9px 10px;margin:0 0 8px}.worldTable article>div{display:grid}.worldTable .zone{font-size:7px;font-weight:800;margin-top:2px}.zone[data-tone="champions"]{color:#2e5da8}.zone[data-tone="continental"]{color:#27734c}.zone[data-tone="promotion"]{color:#247248}.zone[data-tone="playoff"]{color:#91692a}.zone[data-tone="danger"]{color:#b1463e}.worldCalendar article>div em{font-size:7px;color:#a25c35;font-style:normal;margin-top:2px}\n'''
          if '.qualificationNote{' not in s:s+='\n'+addition
          p.write_text(s)
          PY

