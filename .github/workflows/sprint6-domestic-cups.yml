name: Sprint 6 domestic cup fields
on:
  push:
    branches:
      - sprint6-domestic-cups
    paths:
      - "src/data/world-2026/domestic-cup-fields.ts"
      - "src/data/world-2026/domestic-cup-fields.test.ts"
      - "src/game-engine/domestic-cup-engine.test.ts"
      - "src/data/domestic-cup-status.test.ts"
      - "scripts/apply-sprint6-domestic-cups.mjs"
      - ".github/workflows/sprint6-domestic-cups.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v90-sprint6-cups-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint6-domestic-cups
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Sprint 6 engine and health-map integration
        run: node scripts/apply-sprint6-domestic-cups.mjs
      - name: Validate domestic cup fields
        run: npx vitest run src/data/world-2026/domestic-cup-fields.test.ts src/game-engine/domestic-cup-engine.test.ts src/data/domestic-cup-status.test.ts src/data/database-status.test.ts src/game-engine/world-competitions.test.ts
      - name: Validate production build
        run: npm run build
      - name: Persist validated Sprint 6 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-engine/world-competitions.ts src/data/database-status.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(sprint6): integrate real domestic cup participants"
          git push origin HEAD:sprint6-domestic-cups
