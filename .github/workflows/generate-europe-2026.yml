name: Generate Europe 2026 Snapshot
on:
  push:
    branches: [feat/sprint13-europe-stats-tactics]
    paths:
      - scripts/fetch-europe-top-leagues-2026.mjs
      - .github/workflows/generate-europe-2026.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sprint13-europe-stats-tactics
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-europe-top-leagues-2026.mjs
      - name: Commit generated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/europe-2026/top-leagues.ts europe-2026-snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m "data: add Premier League LaLiga and Ligue 1 2026 rosters"
          git push
