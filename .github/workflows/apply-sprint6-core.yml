name: Apply Sprint 6 Core
on:
  push:
    branches: [feat/sprint6-market-contracts]
    paths:
      - scripts/apply-sprint6-core.mjs
      - .github/workflows/apply-sprint6-core.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sprint6-market-contracts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-sprint6-core.mjs
      - name: Commit core integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-engine/season.ts src/game-engine/market.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: connect market to persistent season"
          git push origin HEAD:feat/sprint6-market-contracts
