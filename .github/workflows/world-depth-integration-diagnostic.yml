name: World depth integration diagnostic
on:
  push:
    branches: [v90-world-depth]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture tests
        run: |
          set +e
          npm test > integration-test.log 2>&1
          echo "exit=$?" >> integration-test.log
          exit 0
      - name: Commit diagnostics
        run: |
          rm .github/workflows/world-depth-integration-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: capture integrated world-depth test diagnostics'
          git push
