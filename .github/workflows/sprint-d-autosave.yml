name: Sprint D Autosave
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-sprint-d-autosave.py'
      - '.github/workflows/sprint-d-autosave.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python scripts/apply-sprint-d-autosave.py
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit product change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app src/game-engine
          git commit -m 'feat: sprint D negotiations and resilient autosave' || exit 0
          git push
      - name: Remove rollout tooling
        run: |
          git rm scripts/apply-sprint-d-autosave.py .github/workflows/sprint-d-autosave.yml
          git commit -m 'chore: remove sprint D rollout tooling' || exit 0
          git push
