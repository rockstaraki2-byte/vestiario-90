name: Polish news and 2D
on: [push]
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python scripts/polish-news-2d.py
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit product polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: align news coverage and 2D match narration"
          git push
      - name: Cleanup tooling
        run: |
          git rm scripts/polish-news-2d.py .github/workflows/polish-news-2d.yml
          git commit -m "chore: remove news and 2D polish tooling"
          git push
