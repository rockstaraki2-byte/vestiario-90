name: 2D Scene Engine
on:
  push:
    branches: [main]
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python scripts/apply-2d-scene-engine.py
      - run: python scripts/apply-2d-scene-engine-fix.py
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat: add linked 2D scene engine"
          git push
      - name: Cleanup rollout tooling
        run: |
          git rm scripts/apply-2d-scene-engine.py scripts/apply-2d-scene-engine-fix.py .github/workflows/2d-scene-engine.yml
          git commit -m "chore: remove 2D scene rollout tooling"
          git push
