name: Persistent world v2 upgrade
on:
  push:
    paths:
      - '.github/workflows/persistent-world-v2.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add persistent-world engines and data
        run: |
          cat > src/data/europe-2026/lower-leagues.ts <<'EOF'
          import type { EuropeClubRoster, EuropeRosterPosition } from "./top-leagues";

          export type EuropeLowerCompetitionId="ENG2"|"ESP2"|"FRA2";
          export type EuropeLowerCompetitionRoster={id:EuropeLowerCompetitionId;name:string;shortName:string;country:string;season:2026;startDate:string;roundCadenceDays:number;doubleRoundRobin:true;benchSize:number;maxSubstitutions:number;clubs:EuropeClubRoster[]};
          const POSITIONS:EuropeRosterPosition[]=["GOL","GOL","GOL","ZAG","ZAG","ZAG","ZAG","LE","LE","LD","LD","VOL","VOL","MC","MC","MC","MEI","MEI","PE","PE","PD","PD","ATA","ATA","ATA"];
          function slug(value:string){return value.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/(^-|-$)/g,"").toLowerCase();}
          function club(name:string,index:number,country:string,baseValue:number):EuropeClubRoster{const key=slug(name),players=POSITIONS.map((position,pIndex)=>({transfermarktId:`lower-${key}-${pIndex+1}`,name:`${name.split(/\s+/)[0]} ${String(pIndex+1).padStart(2,"0")}`,position,age:18+((pIndex*3+index)%17),marketValueEur:Math.max(250_000,Math.round((baseValue/25)*(1+((pIndex%7)-3)*.08)/50_000)*50_000),marketValueUpdated:"2026-09-01"}));return{sourceId:-(index+1),transfermarktId:-(100000+index),name,shortName:name.replace(/\b(FC|CF|CD|UD|AS|RC|Real|City|United|Club)\b/gi,"").trim().split(/\s+/).slice(0,2).map(x=>x.slice(0,4).toUpperCase()).join(" ")||name.slice(0,8).toUpperCase(),imageUrl:"/generic-club.svg",marketValueEur:baseValue+index*1_100_000,players};}
          const make=(names:string[],country:string,base:number)=>names.map((name,index)=>club(name,index,country,base));
          const ENG=["Birmingham City","Blackburn Rovers","Bolton Wanderers","Bristol City","Burnley","Cardiff City","Charlton Athletic","Derby County","Lincoln City","Middlesbrough","Millwall","Norwich City","Portsmouth","Preston North End","Queens Park Rangers","Sheffield United","Southampton","Stoke City","Swansea City","Watford","West Bromwich Albion","West Ham United","Wolverhampton Wanderers","Wrexham"];
          const ESP=["AD Ceuta","Albacete","Almería","Burgos","Cádiz","Castellón","Sabadell","Celta Fortuna","Córdoba","Eibar","Eldense","FC Andorra","Girona","Granada","Leganés","Mallorca","Real Oviedo","Real Sociedad B","Sporting Gijón","Real Valladolid","Tenerife","Las Palmas"];
          const FRA=["Annecy","Boulogne-sur-Mer","Clermont","Dijon","Dunkerque","Grenoble","Guingamp","Laval","Metz","Montpellier","Nancy","Nantes","Pau","Red Star","Reims","Rodez","Saint-Étienne","Sochaux"];
          export const EUROPE_LOWER_2026_COMPETITIONS:EuropeLowerCompetitionRoster[]=[
            {id:"ENG2",name:"EFL Championship",shortName:"Championship",country:"Inglaterra",season:2026,startDate:"2026-08-14",roundCadenceDays:7,doubleRoundRobin:true,benchSize:9,maxSubstitutions:5,clubs:make(ENG,"Inglaterra",95_000_000)},
            {id:"ESP2",name:"LaLiga Hypermotion",shortName:"Segunda",country:"Espanha",season:2026,startDate:"2026-08-15",roundCadenceDays:7,doubleRoundRobin:true,benchSize:12,maxSubstitutions:5,clubs:make(ESP,"Espanha",72_000_000)},
            {id:"FRA2",name:"Ligue 2",shortName:"Ligue 2",country:"França",season:2026,startDate:"2026-08-08",roundCadenceDays:7,doubleRoundRobin:true,benchSize:9,maxSubstitutions:5,clubs:make(FRA,"França",55_000_000)},
          ];
          EOF

          cat > public/generic-club.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><path d="M64 6 112 23v36c0 31-18 51-48 63C34 110 16 90 16 59V23L64 6Z" fill="#173d2a"/><path d="M64 18 99 30v28c0 23-12 39-35 50-23-11-35-27-35-50V30L64 18Z" fill="#f1f6f3"/><circle cx="64" cy="58" r="20" fill="#173d2a"/><path d="m64 42 7 5-3 8 7 6-4 8H57l-4-8 7-6-3-8 7-5Z" fill="#f1f6f3"/></svg>
          EOF

          cat > src/game-engine/competition-draws.ts <<'EOF'
          import { SeededRng } from "./rng";
          import type { WorldParticipant } from "./world-competitions";
          export type DrawRecord={stage:string;season:number;pots:string[][];groups?:Record<string,string[]>;notes:string[]};
          const shuffle=<T>(items:T[],rng:SeededRng)=>{const out=[...items];for(let i=out.length-1;i>0;i--){const j=rng.integer(0,i);[out[i],out[j]]=[out[j],out[i]];}return out;};
          function orderedPot(items:WorldParticipant[],rng:SeededRng){return shuffle(items,rng).sort((a,b)=>b.reputation-a.reputation+rng.integer(-1,1));}
          export function drawConmebolGroups(participants:WorldParticipant[],seed:string,season:number,stage="Fase de grupos"){const rng=new SeededRng(`${seed}:conmebol-draw:${season}`),ranked=[...participants].sort((a,b)=>b.reputation-a.reputation),pots=[0,1,2,3].map(i=>orderedPot(ranked.slice(i*8,(i+1)*8),rng)),groups:Record<string,WorldParticipant[]>={};for(let i=0;i<8;i++)groups[String.fromCharCode(65+i)]=[];for(let p=0;p<4;p++){let pool=shuffle(pots[p],rng);for(let g=0;g<8;g++){const key=String.fromCharCode(65+g),existing=groups[key],index=pool.findIndex(team=>!existing.some(other=>other.country===team.country));const chosen=pool.splice(index>=0?index:0,1)[0];groups[key].push({...chosen,pot:p+1});}}return{groups:Object.fromEntries(Object.entries(groups).map(([key,value])=>[key,value])),record:{stage,season,pots:pots.map(p=>p.map(x=>x.name)),groups:Object.fromEntries(Object.entries(groups).map(([key,value])=>[key,value.map(x=>x.name)])),notes:["Quatro potes por força/coefficient do save.","Um clube de cada pote por grupo; restrição de mesma associação aplicada quando possível."]} as DrawRecord};}
          type Edge={home:WorldParticipant;away:WorldParticipant};
          function bestShift(a:WorldParticipant[],b:WorldParticipant[],forbidden:Set<number>){let best=0,bestConf=999;for(let shift=0;shift<b.length;shift++){if(forbidden.has(shift))continue;let conflicts=0;for(let i=0;i<a.length;i++)if(a[i].country===b[(i+shift)%b.length].country)conflicts++;if(conflicts<bestConf){bestConf=conflicts;best=shift;}}return best;}
          function arrangeCycle(items:WorldParticipant[],rng:SeededRng){const left=shuffle(items,rng),out:WorldParticipant[]=[];while(left.length){const prev=out.at(-1),index=prev?left.findIndex(x=>x.country!==prev.country):-1;out.push(left.splice(index>=0?index:0,1)[0]);}if(out.length>2&&out[0].country===out.at(-1)?.country){const swap=out.findIndex((x,i)=>i>1&&x.country!==out[0].country&&out[i-1].country!==out.at(-1)?.country);if(swap>0)[out[swap],out[out.length-1]]=[out[out.length-1],out[swap]];}return out;}
          function colorEdges(edges:Edge[],rng:SeededRng){for(let attempt=0;attempt<240;attempt++){const order=shuffle(edges,rng),used=new Map<string,Set<number>>(),colors=new Map<Edge,number>();let ok=true;for(const edge of order){const hu=used.get(edge.home.id)??new Set<number>(),au=used.get(edge.away.id)??new Set<number>(),available=[0,1,2,3,4,5,6,7].filter(c=>!hu.has(c)&&!au.has(c));if(!available.length){ok=false;break;}const c=available[rng.integer(0,available.length-1)];colors.set(edge,c);hu.add(c);au.add(c);used.set(edge.home.id,hu);used.set(edge.away.id,au);}if(ok&&[...used.values()].every(set=>set.size===8))return colors;}return null;}
          export function drawUefaLeague(participants:WorldParticipant[],seed:string,season:number){const rng=new SeededRng(`${seed}:uefa-draw:${season}`),ranked=[...participants].sort((a,b)=>b.reputation-a.reputation),pots=[0,1,2,3].map(i=>ranked.slice(i*9,(i+1)*9).map(x=>({...x,pot:i+1}))),edges:Edge[]=[];for(const pot of pots){const cycle=arrangeCycle(pot,rng);for(let i=0;i<cycle.length;i++)edges.push({home:cycle[i],away:cycle[(i+1)%cycle.length]});}for(let a=0;a<4;a++)for(let b=a+1;b<4;b++){const pa=arrangeCycle(pots[a],rng),pb=arrangeCycle(pots[b],rng),shift1=bestShift(pa,pb,new Set()),shift2=bestShift(pa,pb,new Set([shift1]));for(let i=0;i<9;i++){edges.push({home:pa[i],away:pb[(i+shift1)%9]});edges.push({home:pb[(i+shift2)%9],away:pa[i]});}}const colors=colorEdges(edges,rng);if(!colors)return null;const rounds=Array.from({length:8},()=>[] as Edge[]);for(const edge of edges)rounds[colors.get(edge)!].push(edge);return{participants:pots.flat(),rounds,record:{stage:"Fase de liga",season,pots:pots.map(p=>p.map(x=>x.name)),notes:["Quatro potes de nove clubes.","Cada clube enfrenta oito adversários: dois de cada pote, com quatro jogos em casa e quatro fora.","Confrontos da mesma associação são evitados pelo algoritmo quando a matriz permite."]} as DrawRecord};}
          export function drawSeededKnockout(seeded:WorldParticipant[],unseeded:WorldParticipant[],seed:string){const rng=new SeededRng(`${seed}:seeded-ko`),a=shuffle(seeded,rng),b=shuffle(unseeded,rng),pairs:Array<[WorldParticipant,WorldParticipant]>=[];for(const seedTeam of a){let index=b.findIndex(x=>x.country!==seedTeam.country);if(index<0)index=0;const challenger=b.splice(index,1)[0];if(challenger)pairs.push([challenger,seedTeam]);}return pairs;}
          EOF

          cat > src/game-engine/competition-governance.ts <<'EOF'
          import type { LeagueClub, LeaguePlayer } from "./league";
          import type { MatchResult } from "./match";
          import type { ProfessionalCompetitionId } from "../data/brazil-2026/competitions";
          import type { WorldCompetitionId, WorldCompetitionsState } from "./world-competitions";
          export type CompetitionRule={label:string;listAMax:number;listB:boolean;benchSize:number;maxSubstitutions:number;yellowThreshold:number;yellowAfterFirstBan:number;resetBeforeSemis:boolean;knockoutChanges:number;notes:string[]};
          export type CompetitionRegistration={competitionId:WorldCompetitionId;season:number;clubId:string;listAIds:string[];listBIds:string[];changesUsed:number;lastSyncedStage:string};
          export type CompetitionDiscipline={competitionId:WorldCompetitionId;playerId:string;yellows:number;yellowSuspensions:number;reds:number;suspensionMatches:number};
          export type CompetitionGovernanceState={season:number;registrations:Partial<Record<WorldCompetitionId,CompetitionRegistration>>;discipline:Record<string,CompetitionDiscipline>;notices:string[]};
          const UEFA_IDS=new Set<WorldCompetitionId>(["UCL","UEL","UECL"]),CONMEBOL_IDS=new Set<WorldCompetitionId>(["LIB","SUD"]);
          const defaultRule=(label:string):CompetitionRule=>({label,listAMax:50,listB:false,benchSize:12,maxSubstitutions:5,yellowThreshold:3,yellowAfterFirstBan:3,resetBeforeSemis:true,knockoutChanges:5,notes:["Lista de competição separada do campeonato nacional.","Suspensões por cartões valem dentro desta competição."]});
          export function worldCompetitionRule(id:WorldCompetitionId):CompetitionRule{if(UEFA_IDS.has(id))return{label:"Regulamento UEFA",listAMax:25,listB:true,benchSize:12,maxSubstitutions:5,yellowThreshold:4,yellowAfterFirstBan:2,resetBeforeSemis:true,knockoutChanges:3,notes:["Lista A: máximo de 25; vagas reservadas a atletas formados localmente.","Lista B jovem é adicional quando o atleta cumpre tempo de formação.","Até três novas inscrições podem ser feitas para a fase eliminatória."]};if(CONMEBOL_IDS.has(id))return{...defaultRule("Regulamento CONMEBOL"),listAMax:50,yellowThreshold:3,yellowAfterFirstBan:3,knockoutChanges:5};return defaultRule("Regulamento da copa");}
          function countryFor(id:ProfessionalCompetitionId){return id.startsWith("BRA")?"Brasil":id.startsWith("ENG")?"Inglaterra":id.startsWith("ESP")?"Espanha":"França";}
          function trained(player:LeaguePlayer,competitionId:ProfessionalCompetitionId){return Boolean((player.clubTrainedYears??0)>=3||player.associationTrained||player.nationality===countryFor(competitionId));}
          function buildRegistration(club:LeagueClub,id:WorldCompetitionId,season:number,competitionId:ProfessionalCompetitionId,stage:string):CompetitionRegistration{const rule=worldCompetitionRule(id),players=[...club.players].sort((a,b)=>b.overall-a.overall||b.condition-a.condition),listB=rule.listB?players.filter(p=>p.age<=21&&(p.clubTrainedYears??0)>=2).map(p=>p.id):[],gks=players.filter(p=>p.position==="GOL"&&!listB.includes(p.id)).slice(0,2),locals=players.filter(p=>trained(p,competitionId)&&!gks.some(g=>g.id===p.id)&&!listB.includes(p.id)),localCount=Math.min(8,locals.length),effectiveMax=rule.listB?rule.listAMax-(8-localCount):rule.listAMax,selected=[...gks,...locals.slice(0,localCount)];for(const p of players)if(selected.length<effectiveMax&&!listB.includes(p.id)&&!selected.some(x=>x.id===p.id))selected.push(p);return{competitionId:id,season,clubId:club.id,listAIds:selected.map(p=>p.id),listBIds:listB,changesUsed:0,lastSyncedStage:stage};}
          function clubParticipates(world:WorldCompetitionsState,id:WorldCompetitionId,clubId:string){const t=world.tournaments.find(x=>x.definition.id===id);return Boolean(t?.participants.some(p=>p.activeClubId===clubId)||t?.matches.some(m=>m.home.activeClubId===clubId||m.away.activeClubId===clubId));}
          export function createCompetitionGovernance(club:LeagueClub,world:WorldCompetitionsState,season:number,competitionId:ProfessionalCompetitionId):CompetitionGovernanceState{const state:CompetitionGovernanceState={season,registrations:{},discipline:{},notices:[]};for(const t of world.tournaments)if(clubParticipates(world,t.definition.id,club.id))state.registrations[t.definition.id]=buildRegistration(club,t.definition.id,season,competitionId,t.currentStage);return state;}
          export function hydrateCompetitionGovernance(value:CompetitionGovernanceState|undefined,club:LeagueClub,world:WorldCompetitionsState,season:number,competitionId:ProfessionalCompetitionId){const state=value?.season===season?structuredClone(value):createCompetitionGovernance(club,world,season,competitionId);for(const t of world.tournaments)if(clubParticipates(world,t.definition.id,club.id)&&!state.registrations[t.definition.id])state.registrations[t.definition.id]=buildRegistration(club,t.definition.id,season,competitionId,t.currentStage);return state;}
          export function syncCompetitionGovernance(value:CompetitionGovernanceState,club:LeagueClub,world:WorldCompetitionsState,competitionId:ProfessionalCompetitionId){const state=structuredClone(value);for(const t of world.tournaments){if(!clubParticipates(world,t.definition.id,club.id))continue;let reg=state.registrations[t.definition.id];if(!reg){state.registrations[t.definition.id]=buildRegistration(club,t.definition.id,state.season,competitionId,t.currentStage);continue;}const rule=worldCompetitionRule(t.definition.id),knockout=t.definition.stages.findIndex(s=>s.name===t.currentStage)>0;if(knockout&&reg.lastSyncedStage!==t.currentStage&&rule.knockoutChanges>0&&reg.changesUsed<rule.knockoutChanges){const fresh=buildRegistration(club,t.definition.id,state.season,competitionId,t.currentStage),old=new Set(reg.listAIds),newIds=fresh.listAIds.filter(id=>!old.has(id)).slice(0,rule.knockoutChanges-reg.changesUsed);if(newIds.length){const protectedIds=new Set(fresh.listAIds),remove=reg.listAIds.filter(id=>!protectedIds.has(id)).slice(0,newIds.length);reg.listAIds=reg.listAIds.filter(id=>!remove.includes(id)).concat(newIds).slice(0,rule.listAMax);reg.changesUsed+=newIds.length;state.notices.unshift(`${t.definition.shortName}: ${newIds.length} alteração(ões) de inscrição para ${t.currentStage}.`);}}reg.lastSyncedStage=t.currentStage;}state.notices=state.notices.slice(0,20);return state;}
          const disciplineKey=(id:WorldCompetitionId,playerId:string)=>`${id}:${playerId}`;
          export function eligiblePlayerIds(value:CompetitionGovernanceState,id:WorldCompetitionId,club:LeagueClub){const reg=value.registrations[id];if(!reg)return club.players.map(p=>p.id);const listed=new Set([...reg.listAIds,...reg.listBIds]);return club.players.filter(p=>listed.has(p.id)&&(value.discipline[disciplineKey(id,p.id)]?.suspensionMatches??0)<=0).map(p=>p.id);}
          export function governanceSummary(value:CompetitionGovernanceState,id:WorldCompetitionId){const reg=value.registrations[id],rule=worldCompetitionRule(id);if(!reg)return{title:rule.label,detail:"Lista ainda não exigida para o seu clube.",rule};return{title:rule.label,detail:`Lista A ${reg.listAIds.length}/${rule.listAMax}${rule.listB?` • Lista B ${reg.listBIds.length}`:""} • alterações de mata-mata ${reg.changesUsed}/${rule.knockoutChanges}.`,rule};}
          export function applyCompetitionDiscipline(value:CompetitionGovernanceState,id:WorldCompetitionId,result:MatchResult,side:"home"|"away",stageBefore:string,stageAfter:string){const state=structuredClone(value),rule=worldCompetitionRule(id);for(const item of Object.values(state.discipline))if(item.competitionId===id&&item.suspensionMatches>0)item.suspensionMatches=Math.max(0,item.suspensionMatches-1);for(const event of result.events.filter(e=>e.team===side&&e.playerId&&(e.type==="card"||e.type==="red_card"))){const playerId=event.playerId!,key=disciplineKey(id,playerId),item=state.discipline[key]??{competitionId:id,playerId,yellows:0,yellowSuspensions:0,reds:0,suspensionMatches:0};if(event.type==="red_card"){item.reds++;item.suspensionMatches=Math.max(item.suspensionMatches,1);}else{item.yellows++;const nextBan=item.yellowSuspensions===0?rule.yellowThreshold:rule.yellowThreshold+item.yellowSuspensions*rule.yellowAfterFirstBan;if(item.yellows>=nextBan){item.yellowSuspensions++;item.suspensionMatches=Math.max(item.suspensionMatches,1);}}state.discipline[key]=item;}if(rule.resetBeforeSemis&&stageBefore==="Quartas de final"&&stageAfter==="Semifinal")for(const item of Object.values(state.discipline))if(item.competitionId===id)item.yellows=0;return state;}
          EOF

          cat > src/game-engine/workload.ts <<'EOF'
          import type { SeasonState } from "./season";
          export type WorkloadAdvice={level:"Baixa"|"Moderada"|"Alta"|"Crítica";score:number;detail:string;rotationRecommended:boolean;loadPenalty:number};
          const DAY=86400000;
          const days=(a:string,b:string)=>Math.round((new Date(`${a}T12:00:00Z`).getTime()-new Date(`${b}T12:00:00Z`).getTime())/DAY);
          function userDates(state:SeasonState){const league=state.league.fixtures.filter(f=>f.played&&f.date&&(f.homeClubId===state.selectedClubId||f.awayClubId===state.selectedClubId)).map(f=>f.date!),cups=state.worldCompetitions.tournaments.flatMap(t=>t.matches.filter(m=>m.played&&(m.home.activeClubId===state.selectedClubId||m.away.activeClubId===state.selectedClubId)).map(m=>m.date));return[...league,...cups].sort();}
          export function workloadAdvice(state:SeasonState,date=state.currentDate,continentalAway=false){const dates=userDates(state).filter(d=>d<date),last=dates.at(-1),rest=last?Math.max(0,days(date,last)):7,recent=dates.filter(d=>days(date,d)<=14).length,avgFatigue=state.league.clubs.find(c=>c.id===state.selectedClubId)?.players.reduce((s,p)=>s+p.fatigue,0)/(state.league.clubs.find(c=>c.id===state.selectedClubId)?.players.length||1)??0;let score=(rest<=2?45:rest===3?28:rest===4?14:4)+Math.max(0,recent-2)*12+Math.max(0,avgFatigue-35)*.55+(continentalAway?12:0);score=Math.round(Math.min(100,score));const level=score>=72?"Crítica":score>=52?"Alta":score>=28?"Moderada":"Baixa",loadPenalty=Math.round((score>=72?8:score>=52?5:score>=28?2:0)+(continentalAway?2:0));return{level,score,rotationRecommended:score>=45,loadPenalty,detail:`${rest} dia(s) desde o último jogo • ${recent} partida(s) nos últimos 14 dias • fadiga média ${Math.round(avgFatigue)}%.${continentalAway?" Viagem continental fora de casa aumenta a carga.":""}`} as WorkloadAdvice;}
          EOF

          cat > src/game-engine/season-ecosystem.ts <<'EOF'
          import { SeededRng } from "./rng";
          import { PROFESSIONAL_COMPETITIONS, type ProfessionalCompetitionId } from "../data/brazil-2026/competitions";
          import { sortedStandings } from "./league";
          import { sortedParallelStandings } from "./world-leagues";
          import type { SeasonState } from "./season";
          import type { WorldCompetitionId } from "./world-competitions";
          export type EcosystemClub={name:string;shortName:string;country:string;competitionId:ProfessionalCompetitionId;reputation:number;points:number;position:number};
          export type DomesticMovement={clubName:string;from:string;to:string;reason:string};
          export type QualificationEntrant={name:string;shortName:string;country:string;reputation:number;reason:string};
          export type LeagueArchive={competitionId:ProfessionalCompetitionId;competitionName:string;champion:string;runnerUp:string;topScorer?:string;topScorerGoals?:number};
          export type SeasonArchive={year:number;leagues:LeagueArchive[];continental:Array<{competitionId:WorldCompetitionId;name:string;champion:string;runnerUp?:string}>;movements:DomesticMovement[];qualifiers:Array<{competitionId:WorldCompetitionId;clubs:string[]}>};
          export type FootballEcosystemState={archives:SeasonArchive[];coefficients:Record<string,number>;nextDomesticParticipants:Partial<Record<ProfessionalCompetitionId,string[]>>;nextInternationalEntrants:Partial<Record<WorldCompetitionId,QualificationEntrant[]>>;lastFinalizedYear?:number};
          export function createFootballEcosystem():FootballEcosystemState{return{archives:[],coefficients:{},nextDomesticParticipants:{},nextInternationalEntrants:{}};}
          export function hydrateFootballEcosystem(value:FootballEcosystemState|undefined){return value?{...createFootballEcosystem(),...value,archives:value.archives??[],coefficients:value.coefficients??{},nextDomesticParticipants:value.nextDomesticParticipants??{},nextInternationalEntrants:value.nextInternationalEntrants??{}}:createFootballEcosystem();}
          function table(state:SeasonState,id:ProfessionalCompetitionId):EcosystemClub[]{const def=PROFESSIONAL_COMPETITIONS.find(c=>c.id===id)!;if(id===state.competitionId){return sortedStandings(state.league).map((row,index)=>{const club=state.league.clubs.find(c=>c.id===row.clubId)!;return{name:club.name,shortName:club.shortName,country:def.country,competitionId:id,reputation:club.reputation,points:row.points,position:index+1};});}const league=state.worldLeagues.leagues[id];if(!league)return[];return sortedParallelStandings(league.standings).map((row,index)=>{const club=league.teams.find(c=>c.id===row.clubId)!;return{name:club.name,shortName:club.shortName,country:def.country,competitionId:id,reputation:Math.round(club.strength),points:row.points,position:index+1};});}
          function completed(state:SeasonState,id:ProfessionalCompetitionId){if(id===state.competitionId)return state.league.fixtures.every(f=>f.played);return state.worldLeagues.leagues[id]?.fixtures.every(f=>f.played)??false;}
          function playoff(a:EcosystemClub,b:EcosystemClub,seed:string){const rng=new SeededRng(seed),sa=a.points+a.reputation*.28+rng.integer(-5,5),sb=b.points+b.reputation*.28+rng.integer(-5,5);return sa>=sb?a:b;}
