name: Sprint B Scouting
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sprint-b-scouting.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/apply-sprint-b.py
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-engine/depth-systems.ts src/app/club-management-view.tsx src/app/club-management-view.module.css
          git commit -m "feat(scouting): add progressive recruitment center 2.0"
          git rm .github/workflows/sprint-b-scouting.yml scripts/apply-sprint-b.py
          git commit -m "chore: remove Sprint B patch tooling"
          git push origin main
