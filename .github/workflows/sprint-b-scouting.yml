name: Sprint B Scouting
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sprint-b-scouting.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Sprint B
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/game-engine/depth-systems.ts')
          s=p.read_text()
          marker='import { personalityProfile, contractDemandModifier, transferInterestModifier } from "./personality";'
          if 'player-attributes' not in s:
            s=s.replace(marker,marker+'\nimport { attributeAverage, playerAttributeProfile, type AttributeGroup } from "./player-attributes";')
          start=s.index('export type ScoutKnowledgeLevel=')
          end=s.index('export type YouthSquad=',start)
          block='''export type ScoutKnowledgeLevel=0|1|2|3|4|5;
export type ScoutedAttributeGroup={label:AttributeGroup;average:string;attributes:Array<{label:string;value:string}>};
export type ScoutReport={knowledge:ScoutKnowledgeLevel;knowledgeLabel:string;overall:string;potential:string;personality:string;marketValue:string;confidence:number;strengths:string[];risks:string[];observations:number;stars:number;recommendation:string;comparison:string;attributeGroups:ScoutedAttributeGroup[];hiddenTraits:string[]};
export function scoutKnowledge(player:LeaguePlayer,userClub:LeagueClub,observationCount=0):ScoutKnowledgeLevel{const scout=delegationQuality(userClub,"scouting"),sameNation=(player.nationality??"")===((userClub.players[0]?.nationality)??""),familiarity=sameNation?1:0,observationBoost=(observationCount>=1?1:0)+(observationCount>=2?1:0)+(observationCount>=4?1:0),base=Math.floor((scout-45)/20)+familiarity+observationBoost;return clamp(base,0,5) as ScoutKnowledgeLevel;}
function scoutedNumber(value:number,knowledge:ScoutKnowledgeLevel,scout:number){if(knowledge>=5)return`${value}`;const spread=Math.max(1,11-knowledge*2-Math.floor((scout-50)/18)),low=clamp(value-spread,1,99),high=clamp(value+spread,1,99);return low===high?`${low}`:`${low}–${high}`;}
function traitLevel(value:number){return value>=80?"Excelente":value>=68?"Bom":value>=55?"Razoável":value>=42?"Atenção":"Fraco";}
export function scoutingReport(player:LeaguePlayer,userClub:LeagueClub,observationCount=0):ScoutReport{const knowledge=scoutKnowledge(player,userClub,observationCount),scout=delegationQuality(userClub,"scouting"),spread=Math.max(0,12-knowledge*2-Math.floor((scout-50)/20)),low=clamp(player.overall-spread,35,99),high=clamp(player.overall+spread,35,99),pSpread=Math.max(1,16-knowledge*2-Math.floor((scout-50)/20)),profile=personalityProfile(player),attrs=playerAttributeProfile(player),knownPersonality=knowledge>=4?`${profile.headline} • ambição ${profile.ambition} • ego ${profile.ego} • adaptabilidade ${profile.adaptability}`:knowledge>=3?profile.headline:"Desconhecida",knownPotential=knowledge>=5?`${player.potential}`:knowledge>=2?`${clamp(player.potential-pSpread,35,99)}–${clamp(player.potential+pSpread,35,99)}`:"Incerto",value=player.marketValueEur,positionPeers=userClub.players.filter(p=>p.position===player.position),benchmark=positionPeers.length?positionPeers.reduce((sum,p)=>sum+p.overall,0)/positionPeers.length:userClub.players.reduce((sum,p)=>sum+p.overall,0)/Math.max(1,userClub.players.length),gap=player.overall-benchmark,upside=Math.max(0,player.potential-player.overall),starScore=gap+upside*.35+(player.age<=21?2:0),stars=Math.max(1,Math.min(5,Math.round(3+starScore/5))),comparison=gap>=5?"Acima dos titulares atuais do setor":gap>=1?"Disputaria posição imediatamente":gap>=-3?"Nível próximo da rotação atual":"Abaixo do nível médio atual do setor",recommendation=stars>=5?"Prioridade máxima de recrutamento":stars>=4?"Recomendado para avançar":stars>=3?"Manter na lista e aprofundar observação":stars>=2?"Somente por oportunidade de mercado":"Não recomendado no cenário atual";
 const group=(label:AttributeGroup,items:{label:string;value:number}[]):ScoutedAttributeGroup=>({label,average:scoutedNumber(attributeAverage(attrs,label),knowledge,scout),attributes:items.map(a=>({label:a.label,value:scoutedNumber(a.value,knowledge,scout)}))});
 const hiddenTraits=knowledge>=4?[`Consistência: ${traitLevel(attrs.hidden.consistencia)}`,`Jogos grandes: ${traitLevel(attrs.hidden.jogosGrandes)}`,`Profissionalismo: ${traitLevel(attrs.hidden.profissionalismo)}`,`Ambição: ${traitLevel(attrs.hidden.ambicao)}`,`Lealdade: ${traitLevel(attrs.hidden.lealdade)}`,`Adaptabilidade: ${traitLevel(attrs.hidden.adaptabilidade)}`,`Propensão a lesão: ${attrs.hidden.propensaoLesao>=65?"Alta":attrs.hidden.propensaoLesao>=42?"Média":"Baixa"}`]:knowledge>=3?["Alguns traços mentais já foram identificados; nova observação pode revelar consistência e jogos grandes."]:[];
 return{knowledge,knowledgeLabel:["Sem conhecimento","Referência inicial","Observado","Conhecido","Bem conhecido","Dossiê completo"][knowledge],overall:knowledge>=5?`${player.overall}`:`${low}–${high}`,potential:knownPotential,personality:knownPersonality,marketValue:value===null?"Sem referência":knowledge>=3?`€${(value/1_000_000).toFixed(1)} mi`:`€${(Math.max(0,value*.72)/1_000_000).toFixed(1)}–${(value*1.3/1_000_000).toFixed(1)} mi`,confidence:clamp(22+knowledge*14+observationCount*4+(scout-50)*.32,20,99),strengths:[player.age<=21?"Margem de desenvolvimento":"Experiência competitiva",profile.professionalism>=70?"Boa abordagem profissional":"Necessita gestão próxima",profile.pressure>=70?"Responde bem à pressão":"Oscila em jogos grandes"],risks:[profile.ego>=75?"Ego alto pode elevar exigências contratuais":"Ego administrável",profile.adaptability<55?"Adaptação a novo contexto pode ser lenta":"Boa capacidade de adaptação"],observations:observationCount,stars,recommendation,comparison,attributeGroups:[group("Técnico",attrs.technical),group("Mental",attrs.mental),group("Físico",attrs.physical)],hiddenTraits};}

'''
          s=s[:start]+block+s[end:]
          p.write_text(s)

          p=Path('src/app/club-management-view.tsx')
          s=p.read_text()
          start=s.index('   <section className={styles.panel}><header><div><span>SCOUTING COM INCERTEZA</span>')
          end=s.index('   <section className={styles.panel}><header><div><span>SUB-17 / SUB-20</span>',start)
          section='''   <section className={styles.panel}><header><div><span>CENTRAL DE RECRUTAMENTO 2.0</span><h3>Conhecimento progressivo • atributos por faixa • comparação com o elenco</h3></div><Search/></header><p className={styles.intro}>Cada observação aumenta o conhecimento real sobre o atleta. Atributos técnicos, mentais e físicos começam como faixas; personalidade e traços ocultos só aparecem quando o dossiê amadurece.</p><div className={styles.targetList}>{targets.map(({player,club:targetClub})=>{const observations=profile.tasks.filter(item=>item.kind==="Observação externa"&&item.targetPlayerId===player.id&&item.status==="Concluída").length,active=profile.tasks.find(item=>item.kind==="Observação externa"&&item.targetPlayerId===player.id&&item.status==="Em andamento"),report=scoutingReport(player,club,observations),market=humanMarketProfile(player,club,targetClub);return <article key={player.id} className={styles.scoutCard}><div className={styles.scoutTop}><div><b>{player.name}</b><span>{targetClub.name} • {player.position} • {player.age} anos</span></div><div className={styles.scoutStars}><b>{"★".repeat(report.stars)}{"☆".repeat(5-report.stars)}</b><small>{report.recommendation}</small></div></div><div className={styles.scoutKnowledge}><span>Conhecimento: <b>{report.knowledgeLabel}</b> • {report.observations} observação(ões)</span><em>{report.confidence}% confiança</em><div><i style={{width:`${report.confidence}%`}}/></div></div><div className={styles.scoutSummary}><span>OVR <b>{report.overall}</b></span><span>POT <b>{report.potential}</b></span><span>Valor <b>{report.marketValue}</b></span><span>Personalidade <b>{report.personality}</b></span></div><p className={styles.comparison}>{report.comparison}. Interesse em vir: {market.interest}% • risco de recusa {market.rejectionRisk}%.</p><div className={styles.attributeGroups}>{report.attributeGroups.map(group=><section key={group.label}><header><b>{group.label}</b><em>MÉDIA {group.average}</em></header>{group.attributes.map(attribute=><div key={attribute.label}><span>{attribute.label}</span><b>{attribute.value}</b></div>)}</section>)}</div>{report.hiddenTraits.length>0&&<div className={styles.hiddenTraits}><b>TRAÇOS OCULTOS / COMPORTAMENTAIS</b>{report.hiddenTraits.map(trait=><span key={trait}>{trait}</span>)}</div>}<div className={styles.scoutProsCons}><div><b>PONTOS POSITIVOS</b>{report.strengths.map(item=><span key={item}>+ {item}</span>)}</div><div><b>RISCOS</b>{report.risks.map(item=><span key={item}>• {item}</span>)}</div></div><div className={styles.targetActions}>{active?<em className={styles.progress}>{`OBSERVANDO ATÉ R${active.dueRound}`}</em>:report.knowledge<5?<button onClick={()=>onResult(requestExternalScout(season,player.id))}>{observations?"OBSERVAR NOVAMENTE":"OBSERVAR"}</button>:<em className={styles.ready}>DOSSIÊ COMPLETO</em>}{observations>0&&<button onClick={()=>onResult(requestBoardTransferContact(season,player.id))}>PEDIR CONTATO</button>}</div></article>})}</div>{finished.filter(task=>task.kind==="Observação externa").slice(0,3).map(task=><article className={styles.report} key={task.id}><b>{task.title}</b><p>{task.result}</p></article>)}</section>

'''
          s=s[:start]+section+s[end:]
          p.write_text(s)

          p=Path('src/app/club-management-view.module.css')
          s=p.read_text()+'''\n.scoutCard{display:grid!important;gap:10px!important}.scoutTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.scoutTop>div:first-child{display:grid;gap:2px}.scoutStars{text-align:right;display:grid;gap:2px}.scoutStars b{color:#d9ff43;letter-spacing:1px;font-size:13px}.scoutStars small{font-size:8px;color:#91aaa2}.scoutKnowledge{display:grid;grid-template-columns:1fr auto;gap:5px;align-items:center}.scoutKnowledge span,.scoutKnowledge em{font-size:9px;font-style:normal}.scoutKnowledge>div{grid-column:1/-1;height:5px;background:#17251f;border-radius:8px;overflow:hidden}.scoutKnowledge i{display:block;height:100%;background:#d9ff43;border-radius:8px}.scoutSummary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.scoutSummary span{display:grid;gap:2px;padding:7px;background:#101a16;border:1px solid #24392f;border-radius:7px;font-size:8px;color:#829b93}.scoutSummary b{font-size:9px;color:#e1ebe7}.comparison{font-size:9px!important;color:#a9bbb5!important;margin:0!important}.attributeGroups{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.attributeGroups section{border:1px solid #263d33;border-radius:8px;background:#0d1713;padding:8px}.attributeGroups section header{display:flex;justify-content:space-between;margin-bottom:5px}.attributeGroups section header b{font-size:9px;color:#d9ff43}.attributeGroups section header em{font-size:8px;font-style:normal;color:#8ba59e}.attributeGroups section>div{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-top:1px solid #1b2d25}.attributeGroups section>div span,.attributeGroups section>div b{font-size:8px}.hiddenTraits{display:flex;flex-wrap:wrap;gap:5px;padding:8px;background:#151a12;border:1px solid #414b20;border-radius:8px}.hiddenTraits>b{width:100%;font-size:8px;color:#d9ff43}.hiddenTraits span{font-size:8px;padding:3px 6px;border-radius:10px;background:#20291b;color:#c6d7ce}.scoutProsCons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.scoutProsCons>div{display:grid;gap:3px;padding:7px;border:1px solid #263d33;border-radius:7px}.scoutProsCons b{font-size:8px;color:#9fb3ac}.scoutProsCons span{font-size:8px;color:#c7d5d0}@media(max-width:720px){.scoutTop{display:grid}.scoutStars{text-align:left}.scoutSummary{grid-template-columns:1fr 1fr}.attributeGroups{grid-template-columns:1fr}.scoutProsCons{grid-template-columns:1fr}}\n'''
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-engine/depth-systems.ts src/app/club-management-view.tsx src/app/club-management-view.module.css
          git commit -m "feat(scouting): add progressive recruitment center 2.0"
          git rm .github/workflows/sprint-b-scouting.yml
          git commit -m "chore: remove sprint B workflow"
          git push origin main
