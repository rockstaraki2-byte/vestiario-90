name: Populate added world leagues
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch-added-leagues-2026.mjs"
      - ".github/workflows/populate-added-world-leagues.yml"
permissions:
  contents: write
concurrency:
  group: v90-data-snapshot-main
  cancel-in-progress: false
jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch real clubs and squads
        run: node scripts/fetch-added-leagues-2026.mjs
      - name: Validate
        run: npm ci && npm run test -- --run
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/world-2026/added-leagues.generated.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: populate Portugal Germany Italy MLS Russia Saudi rosters"
          git pull --rebase origin main
          git push origin HEAD:main
